<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>404 Not Found</title>
<style>html,body{margin:0;background:#111;color:#eee;font-family:sans-serif}</style>
</head>
<body>
<script>
  const pages = [
    '/404/404-lens.html',
    '/404/404-rain.html',
    '/404/404-rooftop2.html',
    '/404/404-stamp.html'
  ];
  const i = Math.random() * pages.length | 0;
  fetch(pages[i])
    .then(r => r.text())
    .then(html => { document.open(); document.write(html); document.close(); })
    .catch(() => { document.body.textContent = 'ページが見つかりません。'; });
</script>
</body>
</html>
