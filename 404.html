<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- 中身は下の script が書き込むが、viewport はここで決めておく。
     書き込まれた <meta name="viewport"> を拾うかどうかはブラウザ任せで、
     取りこぼすと最初の文書のまま約980px幅で組まれ、縮小表示になる。 -->
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>404 Not Found</title>
<style>html,body{margin:0;background:#111;color:#eee;font-family:sans-serif}</style>
</head>
<body>
<script>
  const pages = [
    '/404/404-01-maigo.html',
    '/404/404-02-banchi.html',
    '/404/404-03-kaze.html',
    '/404/404-04-yonin.html',
    '/404/404-05-mizutamari.html',
    '/404/404-06-mosaic.html',
    '/404/404-07-oheya.html',
    '/404/404-08-zeroken.html',
    '/404/404-09-gaitou-tile.html',
    '/404/404-10-gaitou-niji.html',
    '/404/404-11-misregister.html',
    '/404/404-12-yohaku.html',
    '/404/404-13-sannin.html',
    '/404/404-14-tsugiwa.html',
    '/404/404-16-yonbansen.html',
    '/404/404-17-nowplaying.html',
    '/404/404-18-kumori.html',
    '/404/404-19-rosen.html',
    '/404/404-20-omikuji.html',
    '/404/404-21-eawase.html',
    '/404/404-22-kasa.html',
    '/404/404-23-modosu.html',
    '/404/404-24-mado.html',
    '/404/404-25-okuyuki.html',
    '/404/404-26-haiban.html',
    '/404/404-27-kousei.html',
    '/404/404-29-dada.html',
    '/404/404-30-stijl.html',
    '/404/404-31-swiss.html',
    '/404/404-32-brutal.html',
    '/404/404-33-glitch.html',
    '/404/404-34-deconst.html',
    '/404/404-35-balance.html',
    '/404/404-36-acid.html',
    '/404/404-37-suprema.html',
    '/404/404-38-cubism.html',
    '/404/404-39-psyche.html',
    '/404/404-40-caligari.html',
    '/404/404-41-action.html',
    '/404/404-42-stain.html',
    '/404/404-43-gutai.html',
    '/404/404-44-erase.html',
    '/404/404-45-inei.html',
    '/404/404-lens.html',
    '/404/404-rain.html',
    '/404/404-rooftop2.html',
    '/404/404-stamp.html'
  ];
  const i = Math.random() * pages.length | 0;
  fetch(pages[i])
    .then(r => r.text())
    .then(html => {
      document.open(); document.write(html); document.close();
      /* 書き込んだページは innerWidth / innerHeight を測って絵を組む。
         測った時点と実際の表示が食い違っていることがあるので、一度だけ
         組み直させる。window は書き換えをまたいで生き残るので、
         向こうの resize の受け口にそのまま届く。 */
      requestAnimationFrame(() => dispatchEvent(new Event('resize')));
    })
    .catch(() => { document.body.textContent = 'ページが見つかりません。'; });
</script>
</body>
</html>
