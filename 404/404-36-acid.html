<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>404 ｜ 頁は蒸発した</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=IBM+Plex+Mono:wght@400;600&family=Rubik:wght@400;600;800&family=Shippori+Mincho+B1:wght@400;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overflow-x:clip}
html,body{margin:0;padding:0}
img{width:auto;height:auto;max-width:100%;display:block}
a{color:inherit}

:root{
  --pad:clamp(16px,3vw,40px);
  --bg:#05060E;
  --lime:#C8FF00;
  --mag:#FF2FB9;
  --cy:#00E5FF;
}
body{
  min-height:100svh;display:flex;flex-direction:column;
  padding:var(--pad);gap:clamp(8px,1.6svh,20px);
  overflow-x:hidden;background:var(--bg);color:#EAF6FF;cursor:crosshair;
  font-family:"Rubik",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
/* 写真・床グリッド・人物は 1280×800 で重ね合わせてある。板ごと画面を覆う */
.scene{position:fixed;inset:0;overflow:hidden;z-index:0}
.plate{position:absolute;left:0;top:0;width:1280px;height:800px;transform-origin:0 0}
.photo{position:absolute;inset:0;width:1280px;height:800px;object-fit:cover;object-position:50% 46%;
  filter:saturate(1.9) contrast(1.25) hue-rotate(-12deg) brightness(.86)}
.gridcv{position:absolute;inset:0;width:1280px;height:800px;pointer-events:none}
.figure{position:absolute;left:556.2px;top:44.5px;width:206.1px;pointer-events:none}
.figure img{width:100%;height:auto;max-width:none;
  filter:saturate(1.9) contrast(1.25) hue-rotate(-12deg) brightness(.86)}
.lens{position:absolute;width:290px;height:290px;border-radius:50%;pointer-events:none;
  background-repeat:no-repeat;box-shadow:0 0 0 3px var(--lime),0 0 44px rgba(200,255,0,.55),
  inset 0 0 60px rgba(255,47,185,.35);filter:saturate(2.4) contrast(1.2);
  margin:-145px 0 0 -145px;transition:opacity .3s ease;opacity:0}
.tintA{position:absolute;inset:0;pointer-events:none;mix-blend-mode:color-dodge;
  background:radial-gradient(58% 50% at 22% 26%,rgba(255,47,185,.5),transparent 70%)}
.tintB{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;
  background:radial-gradient(52% 46% at 82% 74%,rgba(0,229,255,.42),transparent 70%)}
.noise{position:fixed;inset:0;pointer-events:none;opacity:.16;z-index:1;
  background-image:repeating-conic-gradient(#fff 0 0.0006turn,#000 0 0.0012turn);
  background-size:3px 3px;mix-blend-mode:overlay}

.head,.main,.foot{position:relative;z-index:3}
.head,.main{pointer-events:none}
.head{flex:0 0 auto;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.tag{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:clamp(9px,.95vw,11px);
  letter-spacing:.24em;color:var(--cy);line-height:2;white-space:nowrap}

.main{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:clamp(6px,1.6svh,20px)}
/* 404は塗りを持たない——文字の形に街が抜けている */
.type{position:relative;transform:scaleY(1.18) rotate(-1.6deg);transform-origin:50% 50%;
  max-width:100%}
.type span{font-family:"Archivo",Impact,sans-serif;font-weight:800;
  font-size:var(--tf,180px);line-height:1;letter-spacing:-.075em;white-space:nowrap;display:block}
.glow{position:absolute;left:.055em;top:.06em;color:var(--mag);filter:blur(3px);opacity:.5}
.edge{position:absolute;left:-.025em;top:-.025em;color:transparent;
  -webkit-text-stroke:.05em var(--bg);opacity:.55;filter:blur(1px)}
.chrome{position:relative;background-repeat:no-repeat;background-size:250% auto;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-stroke:.018em var(--lime);
  filter:saturate(3.1) contrast(1.55) brightness(1.34) hue-rotate(-6deg)
         drop-shadow(0 0 36px rgba(200,255,0,.6)) drop-shadow(0 0 14px rgba(255,47,185,.6))}
.say{font-family:"Shippori Mincho B1",serif;font-size:clamp(15px,min(2vw,3.1svh),25px);
  letter-spacing:.3em;text-indent:.3em;color:#FFF;text-align:center;
  text-shadow:0 0 10px rgba(5,6,14,.95),0 0 30px rgba(0,229,255,1),0 2px 2px rgba(5,6,14,.9)}

/* ---- 到着時の動き（原案の共通指定） ---- */
@keyframes enFade{from{opacity:0}to{opacity:1}}
@keyframes acIn{
  from{opacity:0;transform:scaleY(1.18) rotate(-1.6deg) scale(.86)}
  to{opacity:1;transform:scaleY(1.18) rotate(-1.6deg) scale(1)}}
.type{animation:acIn .9s cubic-bezier(.16,1,.3,1) backwards}
.tag,.link,.say{animation:enFade .9s ease .45s backwards}

/* 貼り紙。装飾なので画面の割合で置く */
.stickers{position:fixed;inset:0;pointer-events:none;z-index:2}
.st{position:absolute;font-weight:800;font-size:clamp(10px,1.15vw,14px);letter-spacing:.12em;
  text-transform:uppercase;padding:7px 14px;border-radius:999px;white-space:nowrap;
  animation:float 5.2s ease-in-out infinite;will-change:transform}
@keyframes float{0%,100%{transform:translate(0,0) rotate(var(--rr,0deg))}
  50%{transform:translate(0,-14px) rotate(calc(var(--rr,0deg) * -1))}}
.lime{background:var(--lime);color:var(--bg)}
.mg{background:var(--mag);color:var(--bg)}
.cyn{background:var(--cy);color:var(--bg)}
.out{background:transparent;color:var(--lime);border:2px solid var(--lime)}
#goBack{pointer-events:auto;cursor:pointer;font-family:inherit;touch-action:manipulation}

.foot{flex:0 0 auto;display:flex;flex-wrap:wrap;align-items:center;
  justify-content:space-between;gap:12px 18px}
.link{font-weight:800;font-size:clamp(11px,1.25vw,15px);letter-spacing:.2em;text-transform:uppercase;
  color:var(--bg);background:var(--lime);padding:12px 26px;border-radius:999px;
  text-decoration:none;box-shadow:0 0 34px rgba(200,255,0,.75);white-space:nowrap}
.link:hover{background:#E4FF6A}
.hint{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:clamp(10px,1vw,12px);
  letter-spacing:.14em;color:var(--lime);border:1px solid rgba(200,255,0,.5);padding:6px 12px;
  white-space:nowrap}

@media (max-width:760px){
  .st.drop{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important}
}
/* 指でなぞる案。ブラウザにスクロール等でジェスチャを奪わせない */
body{touch-action:none;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
a{touch-action:manipulation}
</style>
</head>
<body>

<div class="scene" aria-hidden="true">
  <div class="plate" id="plate">
    <img class="photo" src="/404/404-36-acid/sc_neon.webp" alt="" decoding="async">
    <canvas class="gridcv" width="1280" height="800"></canvas>
    <div class="figure"><img src="/404/404-36-acid/fig_neon.webp" alt="" decoding="async"></div>
    <div class="tintA"></div>
    <div class="tintB"></div>
    <div class="lens" id="lens"></div>
  </div>
</div>
<div class="noise" aria-hidden="true"></div>

<div class="stickers" aria-hidden="true">
  <div class="st lime" style="left:7%;top:16%;--rr:-8deg">no such page</div>
  <div class="st mg"   style="right:6%;top:21%;--rr:11deg">404 ↯</div>
  <div class="st cyn drop" style="left:9%;bottom:22%;--rr:6deg">error ✳ 2026</div>
  <button type="button" class="st out drop" id="goBack" style="right:7%;bottom:20%;--rr:-5deg">→ go back</button>
  <div class="st lime drop" style="left:44%;top:11%;--rr:3deg">↯ signal ↯</div>
</div>

<header class="head">
  <div class="tag">CH.404<br>NO SIGNAL<br>ACID / 2026</div>
</header>

<main class="main">
  <div class="type" id="type">
    <span class="edge" aria-hidden="true">404</span>
    <span class="glow" aria-hidden="true">404</span>
    <span class="chrome" id="chrome">404</span>
  </div>
  <div class="say">頁は蒸発した</div>
</main>

<footer class="foot">
  <a class="link" href="/?from=404-36-acid">take me home</a>
  <div class="hint" id="hint">ここは何かおかしい。早く戻ろう。</div>
</footer>

<script>
(function(){
  /* 指では pointerdown を捕まえておかないと、なぞっている途中で移動が届かなくなる */
  function grab(e){
    if(e.target.closest('a,button')) return;
    if(e.cancelable) e.preventDefault();
    try{ document.body.setPointerCapture(e.pointerId); }catch(_){}
  }
  window.addEventListener('pointerdown',grab,{passive:false});
  var plate=document.getElementById('plate'), scene=plate.parentNode;
  var gcv=plate.querySelector('.gridcv'), g=gcv.getContext('2d');
  var lens=document.getElementById('lens');
  var chrome=document.getElementById('chrome');
  var type=document.getElementById('type');
  var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  var touch=!matchMedia('(hover:hover)').matches;
  if(touch){ var hn=document.getElementById('hint'); if(hn) hn.textContent='ここは何かおかしい。早く戻ろう。'; }
  chrome.style.backgroundImage='url("/404/404-36-acid/sc_roof.webp")';

  /* --- 板を画面いっぱいに覆う。写真・グリッド・人物の位置関係は崩れない --- */
  var scale=1, ox=0, oy=0;
  function fit(){
    var w=scene.clientWidth, h=scene.clientHeight;
    scale=Math.max(w/1280,h/800);
    ox=(w-1280*scale)/2; oy=(h-800*scale)/2;
    plate.style.transform='translate('+ox.toFixed(1)+'px,'+oy.toFixed(1)+'px) scale('+scale.toFixed(4)+')';
    fitType();
  }

  /* --- 404 の級数は欄の実寸から決める（代替フォントでも溢れない） --- */
  /* 文字幅は canvas で実測する。DOM を触らないので入場アニメの途中でも狂わない */
  var mcv=document.createElement('canvas').getContext('2d');
  function widthAt100(){
    mcv.font='800 100px Archivo, Impact, sans-serif';
    if('letterSpacing' in mcv) mcv.letterSpacing='-7.5px';   /* -.075em @100px */
    return mcv.measureText('404').width || 190;
  }
  function fitType(){
    var main=type.parentNode;
    var w100=widthAt100()/100;                 /* 1px あたりの字幅 */
    var roomW=document.documentElement.clientWidth*0.86;
    var roomH=Math.max(80,main.clientHeight)*0.52;
    var byW=roomW/(w100+0.034);                /* 傾き 1.6° 分の太りを見込む */
    var byH=roomH/1.18;                        /* 縦に 1.18 倍に伸ばしてある */
    var tf=Math.max(40,Math.min(560,Math.min(byW,byH)));
    type.style.setProperty('--tf',Math.floor(tf)+'px');
  }
  window.addEventListener('resize',fit);
  fit();
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fitType).catch(function(){});

  /* --- 床グリッド：写真の消失点(594,370)に合わせた透視投影 --- */
  var VX=594, Y0=370, C=430, BOT=800;
  function grid(t){
    g.clearRect(0,0,1280,800);
    for(var k=-11;k<=11;k++){
      var bx=VX+k*132;
      var gr=g.createLinearGradient(VX,Y0,VX+(bx-VX)*1.4,Y0+(BOT-Y0)*1.4);
      gr.addColorStop(0,'rgba(200,255,0,0)');
      gr.addColorStop(.18,'rgba(200,255,0,.10)');
      gr.addColorStop(1,'rgba(200,255,0,.78)');
      g.strokeStyle=gr; g.lineWidth=1.7;
      g.beginPath(); g.moveTo(VX,Y0); g.lineTo(VX+(bx-VX)*1.4, Y0+(BOT-Y0)*1.4); g.stroke();
    }
    var ph=1-((t*0.42)%1);
    for(var j=0;j<30;j++){
      var y=Y0+C/(j+ph);
      if(y>804||y<Y0+2) continue;
      var f=Math.min(1,(y-Y0)/280);
      g.strokeStyle='rgba(200,255,0,'+(f*f*0.8).toFixed(3)+')';
      g.lineWidth=Math.max(.7,f*2.4);
      g.beginPath(); g.moveTo(0,y); g.lineTo(1280,y); g.stroke();
    }
    g.strokeStyle='rgba(200,255,0,.3)'; g.lineWidth=1;
    g.beginPath(); g.moveTo(0,Y0); g.lineTo(1280,Y0); g.stroke();
  }
  grid(0);

  var Z=2.35;
  lens.style.backgroundImage='url("/404/404-36-acid/sc_neon.webp")';
  lens.style.backgroundSize=(1280*Z)+'px '+(800*Z)+'px';

  var sts=[].slice.call(document.querySelectorAll('.st:not(#goBack)'));
  var tx=640,ty=400,cx=640,cy=400,on=0,gt=0,auto=touch,t0=Date.now();

  function move(e){
    tx=(e.clientX-ox)/Math.max(0.0001,scale);
    ty=(e.clientY-oy)/Math.max(0.0001,scale);
    on=1; auto=false;
  }
  function leave(){ on=0; }
  function loop(){
    gt+=0.016; grid(gt);
    if(auto){
      var s=(Date.now()-t0)/1000;
      tx=640+Math.sin(s*0.5)*320; ty=420+Math.cos(s*0.37)*180; on=1;
    }
    cx+=(tx-cx)*.16; cy+=(ty-cy)*.16;
    lens.style.left=cx+'px'; lens.style.top=cy+'px';
    lens.style.backgroundPosition=(-cx*Z+145)+'px '+(-cy*Z+145)+'px';
    lens.style.opacity=on?'1':'0';
    chrome.style.backgroundPosition=(70-(cx/1280)*66).toFixed(1)+'% '+(90-(cy/800)*84).toFixed(1)+'%';
    /* 貼り紙はカーソルから逃げる */
    var px=cx*scale+ox, py=cy*scale+oy;
    for(var i=0;i<sts.length;i++){
      var r=sts[i].getBoundingClientRect();
      var dx=r.left+r.width/2-px, dy=r.top+r.height/2-py, d=Math.hypot(dx,dy);
      var push=d<300?(300-d)/300*34:0;
      sts[i].style.marginLeft=(dx/(d||1)*push).toFixed(1)+'px';
      sts[i].style.marginTop=(dy/(d||1)*push).toFixed(1)+'px';
    }
    requestAnimationFrame(loop);
  }
  window.addEventListener('pointermove',move,{passive:true});
  window.addEventListener('pointerleave',leave);
  if(!reduce) loop();

  var backBtn=document.getElementById('goBack');
  if(backBtn){
    backBtn.addEventListener('click',function(){
      if(history.length>1) history.back();
      else location.href='/?from=404-36-acid';
    });
  }
})();
</script>
</body>
</html>
