  --olive:#5C6350;

  --stage:#000000;
  --scrim:rgba(10,11,8,.93);

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--gothic); font-size:15px; line-height:1.75;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1240px;margin:0 auto;padding:36px 24px 80px;display:flex;flex-direction:column;gap:28px}

/* ---- header ---- */
.masthead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px 32px;align-items:end;
  border-bottom:1px solid var(--line);padding-bottom:20px}
@media (max-width:860px){.masthead{grid-template-columns:1fr}}
.masthead h1{font-family:var(--mincho);font-weight:800;font-size:clamp(28px,4vw,42px);
  margin:0;letter-spacing:.03em;text-wrap:balance}
.masthead h1 span{color:var(--accent)}
/* 文字の階層は三段だけ：14.5（読ませる）／12（操作）／10.5（見出し・ラベル） */
.lede{margin:12px 0 0;color:var(--ink-2);max-width:60ch;font-size:14.5px;line-height:1.95}
.meta{font-size:10.5px;letter-spacing:.2em;color:var(--ink-3);font-feature-settings:"palt";margin:0}

/* 右肩のひとかたまり：見た目 → その説明 → さがす */
.ctl{display:flex;flex-direction:column;align-items:flex-end;gap:9px;justify-self:end}
@media (max-width:860px){.ctl{align-items:flex-start;justify-self:start}}
.ctl-row{display:flex;gap:9px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:860px){.ctl-row{justify-content:flex-start}}
.ctl input[type=search]{background:var(--panel);border:1px solid var(--line);color:var(--ink);
  padding:7px 14px;border-radius:999px;font:inherit;font-size:12px;width:13.5rem;max-width:100%}
.ctl input[type=search]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.pill{font:inherit;font-size:12px;color:var(--ink-2);background:var(--panel);border:1px solid var(--line);
  border-radius:999px;padding:6px 15px;cursor:pointer;line-height:1.5}
.pill:hover{color:var(--ink);border-color:var(--ink-3)}
.pill:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---- 見た目：配色は色玉、明暗は文字 ---- */
.look{gap:0;border:1px solid var(--line);border-radius:999px;background:var(--panel);
  padding:4px 5px 4px 13px;align-items:center}
.look .lbl{font-size:10.5px;letter-spacing:.2em;color:var(--ink-3);padding-right:11px;white-space:nowrap}
.seg{display:inline-flex;align-items:center}
.seg button{font:inherit;font-family:var(--mincho);font-size:12px;letter-spacing:.08em;line-height:1.5;
  color:var(--ink-3);background:transparent;border:0;border-radius:999px;padding:5px 11px;cursor:pointer}
.seg button:hover{color:var(--ink)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-1px}
#modes button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.look .rule{width:1px;align-self:stretch;background:var(--line);margin:0 9px}

/* 色玉 */
#skins{gap:7px;padding:0 2px}
#skins button{width:20px;height:20px;padding:0;border-radius:50%;position:relative;
  background:linear-gradient(135deg,var(--d1) 0 50%,var(--d2) 50% 100%);
  box-shadow:inset 0 0 0 1px rgba(128,128,128,.4);transition:transform .14s ease}
#skins button:hover{transform:scale(1.14)}
#skins button[aria-pressed="true"]{
  box-shadow:inset 0 0 0 1px rgba(128,128,128,.4),0 0 0 2px var(--panel),0 0 0 3.5px var(--ink)}
#skins button:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.skinnote{margin:0;font-size:12px;color:var(--ink-3);text-align:right;max-width:44ch;line-height:1.7}
@media (max-width:860px){.skinnote{text-align:left}}
@media (max-width:620px){
  .look{border-radius:16px;padding:9px 12px;flex-wrap:wrap;gap:8px}
  .look .rule{display:none}
}

/* ---- layout ---- */
.layout{display:grid;grid-template-columns:262px minmax(0,1fr);gap:26px;align-items:start}
@media (max-width:960px){.layout{grid-template-columns:1fr}}

/* ---- rail ---- */
.rail{display:flex;flex-direction:column;gap:2px;position:sticky;top:16px;max-height:calc(100vh - 32px);
  overflow-y:auto;overscroll-behavior:contain;padding-right:6px;
  scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.rail::-webkit-scrollbar{width:8px}
.rail::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px;border:2px solid transparent;background-clip:padding-box}
@media (max-width:960px){.rail{position:static;max-height:none;overflow:visible}}
.grp{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--ink-3);
  padding:18px 12px 7px;text-transform:uppercase}
.grp:first-child{padding-top:2px}
.tab{
  display:grid;grid-template-columns:38px minmax(0,1fr);gap:0 10px;text-align:left;cursor:pointer;
  background:transparent;border:0;border-left:2px solid transparent;
  padding:10px 10px 10px 12px;color:var(--ink-2);font:inherit;border-radius:0 6px 6px 0;
  transition:background .16s ease,color .16s ease,border-color .16s ease;width:100%;
}
.tab:hover{background:var(--panel);color:var(--ink)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.tab[hidden]{display:none}
.tab .num{grid-row:span 2;font-family:var(--mono);font-size:11px;color:var(--ink-3);
  letter-spacing:.04em;padding-top:5px;min-width:0;overflow:hidden}
.tab .num.w{font-size:9px;letter-spacing:0}
.tab .nm{font-family:var(--mincho);font-size:16px;font-weight:700;line-height:1.45;overflow-wrap:anywhere}
.tab .sub{font-size:11.5px;color:var(--ink-3);line-height:1.6;margin-top:2px}
.tab[aria-selected="true"]{background:var(--panel);color:var(--ink);border-left-color:var(--accent)}
.tab[aria-selected="true"] .num{color:var(--accent)}
.empty{padding:16px 12px;color:var(--ink-3);font-size:12.5px}

/* ---- viewer ---- */
.viewer{display:flex;flex-direction:column;gap:16px;min-width:0}
.frame{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;
  box-shadow:var(--shadow)}
.chrome{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);
  background:var(--panel-2)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line);flex:0 0 auto}
.url{margin-left:6px;font-size:11.5px;color:var(--ink-3);font-family:var(--mono);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.chrome .acts{display:flex;gap:6px;flex:0 0 auto}
.chrome .acts button{font:inherit;font-size:12px;color:var(--ink-2);background:transparent;
  border:1px solid var(--line);border-radius:999px;padding:3px 12px;cursor:pointer;white-space:nowrap}
.chrome .acts button:hover{color:var(--ink);border-color:var(--ink-3)}
.chrome .acts button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stagebox{position:relative;overflow:hidden;background:#000}
.stagebox iframe{width:1280px;height:800px;border:0;display:block;transform-origin:top left;background:#fff}
.stagebox .ph{position:absolute;inset:0;display:grid;place-items:center;color:#8a8a80;font-size:12px;
  letter-spacing:.18em;font-family:var(--mono);background:#0d0f0b}
.stagebox .ph[hidden]{display:none!important}

/* ---- spec ---- */
.spec{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:0}
.spec>div{background:var(--panel);padding:13px 16px 15px;min-width:0}
.spec dt{font-size:10.5px;letter-spacing:.18em;color:var(--ink-3);margin:0 0 6px}
.spec dd{margin:0;font-size:13px;color:var(--ink-2);line-height:1.75;overflow-wrap:anywhere}
.sw{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.sw i{width:22px;height:22px;border-radius:4px;border:1px solid rgba(128,128,128,.35);display:block}
.hex{font-family:var(--mono);font-size:11px;letter-spacing:.02em;color:var(--ink-3);display:block;margin-top:7px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.tags b{font-family:var(--mono);font-weight:400;font-size:10.5px;letter-spacing:.04em;color:var(--olive);
  border:1px solid var(--line);border-radius:4px;padding:1px 7px;background:var(--bg)}
.note{color:var(--ink-2);font-size:13.5px;max-width:74ch;margin:0}
.note b{color:var(--ink);font-weight:600}
.head2{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:0}
.head2 h2{font-family:var(--mincho);font-size:24px;font-weight:700;margin:0;letter-spacing:.04em}
.head2 .no{font-family:var(--mono);font-size:11.5px;color:var(--accent);letter-spacing:.14em}
.head2 .mv{font-size:12.5px;color:var(--ink-3)}
.era{margin:0;font-size:12.5px;color:var(--ink-3);border-left:3px solid var(--line);padding-left:12px}

/* ---- overlay ---- */
.overlay{position:fixed;inset:0;background:rgba(10,11,8,.93);z-index:50;display:none;
  align-items:center;justify-content:center;padding:20px}
.overlay.on{display:flex}
.overlay .stagebox{border-radius:10px;box-shadow:0 30px 80px -20px #000}
.close{position:absolute;top:16px;right:20px;background:transparent;border:1px solid rgba(255,255,255,.34);
  color:#EFEFE8;border-radius:999px;padding:6px 16px;font:inherit;font-size:13px;cursor:pointer;z-index:2}
.close:hover{border-color:#EFEFE8}

footer{border-top:1px solid var(--line);padding-top:16px;font-size:11.5px;color:var(--ink-3);line-height:1.9}
footer code{font-family:var(--mono);font-size:11px}

/* ---- 見出しと番号に色を通す ---- */
.masthead h1{position:relative;display:inline-block;padding-bottom:6px}
.masthead h1::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;
  background:linear-gradient(90deg,var(--accent) 0 46%,var(--olive) 46% 72%,transparent 72%);border-radius:2px}
.grp{display:flex;align-items:center;gap:10px;color:var(--accent)}
.grp::after{content:"";flex:1;height:1px;background:var(--line)}
.tab .num{font-weight:600;color:var(--ink-3);background:var(--panel-2);border-radius:4px;
  text-align:center;padding:2px 0;line-height:1.5;height:fit-content;margin-top:3px}
.tab[aria-selected="true"] .num{background:var(--accent);color:var(--panel)}
.tab[aria-selected="true"]{box-shadow:inset 0 0 0 1px var(--line)}
.head2 .no{background:var(--accent);color:var(--panel);border-radius:4px;padding:2px 9px;letter-spacing:.08em}
.spec dt{color:var(--accent)}
.stagebox{background:var(--stage)}
.stagebox .ph{background:var(--stage)}
.overlay{background:var(--scrim)}
.note{border-left:3px solid var(--accent);padding-left:14px}
.era{border-left-color:var(--olive)}
.pill{border-color:var(--accent);color:var(--accent)}
.pill:hover{background:var(--accent);color:var(--panel);border-color:var(--accent)}

/* 色玉の色 */
#skins button[data-k=""]{--d1:#E6E8DF;--d2:#A8452A}
#skins button[data-k="shuboku"]{--d1:#F1EADA;--d2:#B03A22}
#skins button[data-k="yakou"]{--d1:#E4ECF4;--d2:#1C6FA8}
#skins button[data-k="kousei"]{--d1:#E7E1CF;--d2:#CE2418}
#skins button[data-k="denshou"]{--d1:#E8F4FF;--d2:#D6008C}
#skins button[data-k="hakuji"]{--d1:#FFFFFF;--d2:#1B4F8F}

、その下から線だけが返ってくる</b>。同じ「行為が絵になる」系譜で、絵具と支持体の関係だけが正反対。404は輪郭しか持たないので、どれだけ染みても〇の内側は埋まらない。<b>弱点は</b>変化がゆっくりで、短時間では何も起きていないように見える。","tech":["mix-blend","canvas","filter","js","pointer","scroll"],"kf":0,"fonts":["Archivo","IBM+Plex+Mono","Shippori+Mincho+B1"],"bytes":12737},{"f":"404-43-gutai.html","nm":"具体（紙を破る）","sb":"破れるのは紙だけ、桟は残る","grp":4,"mv":"具体美術協会（紙を破る）","era":"1954–1972／芦屋。吉原治良のもとで、絵具を投げる・足で描く・紙を突き破るといった行為そのものを作品にした。","pal":["#EFE9DC","#4A3B28","#14120E","#B23A2E"],"hex":["#EFE9DC","#14120E","#2E2417","#4A3B28","#B23A2E","#000000"],"type":"Archivo 800（紙に透ける404）／ Shippori Mincho B1（和文）","layout":"画面全体が障子。桟はDOMで組み、紙だけをcanvasに描いてある。だから<b>破れるのは紙だけで、桟は残る</b>。紙の向こうには雨の庭。","motion":"<b>クリックで紙を突き破る。</b>穴は不定形に裂け、そこから七本の裂け目が走り、破れ口には和紙の繊維が毛羽立つ。障子全体が一瞬震える。カーソルを当てると紙が押されて陰る。開いて1秒後、一発目は勝手に破れる。","note":"<b>ねらい。</b>塗るのでも染みるのでもなく<b>破る</b>。具体は「物質が傷つけられる音と痕跡」を作品にした運動で、日本で生まれた数少ない前衛の一つ。404を「向こう側を確かめるために破いてみる」画面にした。破っても庭があるだけで、頁は無い。<b>弱点は</b>破ると戻せない（それが正しいのだが、案内としては不親切）。","tech":["mix-blend","canvas","filter","keyframes","js","pointer"],"kf":1,"fonts":["Archivo","IBM+Plex+Mono","Shippori+Mincho+B1"],"bytes":10698},{"f":"404-44-erase.html","nm":"消去のドローイング","sb":"消し切っても、活版の404は残る","grp":4,"mv":"消去のドローイング","era":"1953／ラウシェンバーグが他人の素描を一か月かけて消し、それを自分の作品として発表した。描く代わりに、消すことで作る。","pal":["#E7E2D4","#211F1A","#6E6858","#8B4A2E"],"hex":["#211F1A","#E7E2D4","#8B4A2E","#8B8471","#6E6858"],"type":"Archivo 800（鉛筆の404）／ 同（活版の404）／ IBM Plex Mono（画材表記）","layout":"紙の目が立った地に、鉛筆で描いた像と404。その下、消えない位置に活版で刷った小さな404を置いてある。","motion":"<b>こするほど鉛筆が消える。</b>速く動かすほど広く消え、消したそばから灰色の擦り跡が残る——完全な白には戻らない。開くと三度、勝手に擦られる。全部消しきっても、紙に刷られた404だけは最後まで残る。","note":"<b>ねらい。</b>三十一は塗って埋め、三十二は染みて透け、これは<b>消して無くす</b>。三つとも「行為の痕跡が絵になる」同じ系譜だが、物質の向きが違う。消し切ったとき画面に何も無いのは失敗ではなく、それがこの案の完成形。<b>弱点は</b>結末が一つしか無い。","tech":["canvas","js","pointer","scroll"],"kf":0,"fonts":["Archivo","IBM+Plex+Mono","Shippori+Mincho+B1"],"bytes":9067},{"f":"404-45-inei.html","nm":"陰翳","sb":"障子の一間ぶんを、縦組みで","grp":4,"mv":"","era":"","pal":["#E7E0CF","#1D1610","#9A3327","#4A392A"],"hex":["#000000","#6A5C49","#9A3327","#1D1610","#4A392A","#2A2016","#7A6B55","#8E3B2A"],"type":"Shippori Mincho B1（縦組みの一文・四〇四）／ IBM Plex Mono（not found）","layout":"画面ぜんたいを一間の障子にする。左右二枚の建具に組子と和紙を重ね、左の紙に「お探しの頁は、この先にございません。」を一字ずつ縦に並べ、右の紙に四〇四と朱の落款「不在之間」を置く。上に欄間、両脇に柱。障子の向こう側には同じ写真がもう一枚、透けて入っている。","motion":"紙は二層になっていて、向こう側の景色がマスクとぼかし越しに滲む。光の漏れ（spill）と塵（motes）がゆっくり漂い、drift のアニメーションで一間ぜんたいが呼吸する。左右にドラッグすると障子の開く量が変わる（触れると引手のように ew-resize の矢印になる）。","note":"ねらい。『陰翳礼讃』の読み替え。四十四案までが「見せる」方向に働いていたので、ここだけ「見せない」ことを様式にした。紙一枚を隔てた向こうに何かがある——という状態を保ったまま、決して開き切らない。四〇四を「不在之間」という部屋の名として扱い、落款で締める。弱点は文字が極端に少なく、導線としてはほとんど働かないこと。","tech":["mask","mix-blend","filter","keyframes","js","pointer","scroll","grid"],"kf":1,"fonts":["IBM+Plex+Mono","Shippori+Mincho+B1"],"bytes":16122},{"f":"404-lens.html","nm":"稽古場で覗く","sb":"虫めがねの中だけ絵が入れ替わる","grp":5,"mv":"","era":"","pal":["#E9ECDF","#1F2419","#96603E","#4C543F"],"hex":["#A9B394","#000000","#E9ECDF","#1F2419","#4C543F","#7E8A6B","#C3CBB2","#3F4A32"],"type":"見出し：Shippori Mincho B1 ／ 本文とリンク：Zen Kaku Gothic New","layout":"左半分は実用側——見出し、説明、サイト内検索、主要リンク四本。右半分に絵を一枚。二段組みを崩さない。","motion":"右の絵の上でカーソル（スマホは指）を動かすと、丸く切り抜かれた中だけがデフォルメ版の四コマに入れ替わる。二枚は同じ縦横比で、顔の位置もほぼ揃えてあるのでぴたりと重なる。CSS マスクで丸を移動しているだけで、画像の差し替えはしていない。","note":"ねらい。初期四案のうち、いちばん実用に寄せた一枚。左半分を検索と導線のまま残したので、遊びを足しても404としての役目が落ちない。虫めがねは「探す」という動作そのもので、見つからない頁を探しているあいだ、絵の中だけは必ず何かが見つかる。検索はサイト内に受け皿が無いので Google の site: 検索へ投げている。","tech":["mask","js","pointer","grid"],"kf":0,"fonts":["Shippori+Mincho+B1","Zen+Kaku+Gothic+New"],"bytes":11468},{"f":"404-rain.html","nm":"雨の道","sb":"譜の記号が降り、404の形に積もる","grp":5,"mv":"","era":"","pal":["#EEF2F6","#0D1116","#A9C6DA","#C7D6E2"],"hex":["#EEF2F6","#A9C6DA","#0D1116","#FFFFFF","#C7D6E2","#F4F7FA","#CFDDE8","#DCE7F0"],"type":"見出し：Shippori Mincho B1 ／ 欧文の 4 0 4 は字間を大きく開いた Zen Kaku","layout":"濡れた路面の写真を全面に。左上に文言、下辺に主要リンクと検索。canvas を遠景・近景の二枚重ねて、あいだに veil を挟む。","motion":"譜の記号が雨のように降り、路面に「404」の形で積もる（水面に映り込む）。積もったらそのまま、場面は切り替わらない。雨だけは降りつづけ、マウスを左右に動かすと雨脚の向きが変わる。","note":"ねらい。屋上案（rooftop2）から場面転換を取り除いた一枚もの。「積もったらそのまま」が要点で、待っても何も起きないぶん、文字を読む時間ができる。降っているのが雨粒ではなく譜の記号なのは、サイトの主題をエラー画面に持ち込むいちばん軽い方法だから。逃げ道は下辺に置いてある——上半分は文言と404の山で埋まっているため。","tech":["canvas","js","pointer"],"kf":0,"fonts":["Shippori+Mincho+B1","Zen+Kaku+Gothic+New"],"bytes":13492},{"f":"404-rooftop2.html","nm":"屋上の時雨","sb":"雨があがると、見出しごと変わる","grp":5,"mv":"","era":"","pal":["#F4F7FA","#0E1319","#9CC4DE","#F0B47A"],"hex":["#F4F7FA","#EDF1F5","#9CC4DE","#F0B47A","#0E1319","#FFFFFF","#C7D6E2","#CFDDE8"],"type":"見出し：Shippori Mincho B1（雨中と雨上がりで文言ごと入れ替わる）","layout":"屋上の写真を二枚（嵐と夜明け）重ねて置き、canvas の雨を前後に挟む。中央に文言、下に「はじめの場所へ」、右下に現在の天気。","motion":"入ったときは降っている。しばらくすると雨があがり、写真が嵐から夜明けへ入れ替わり、見出しも「この頁は、見つかりませんでした。」から「雨は、あがったようです。」に差し替わる。状態表示だけが常に現在地を告げている。","note":"ねらい。404を「待てば変わるもの」として扱った唯一の案。頁は見つからないままだが、画面のほうが先に変わる——待っていた人にだけ小さな報酬がある構造。ファイル先頭に404ページのパスの扱い（ルート絶対パス／base／フルURL）とサーバ設定（ソフト404はNG）を長めに書き残してあり、この四案は実装メモを兼ねた版でもある。","tech":["canvas","keyframes","js"],"kf":1,"fonts":["Shippori+Mincho+B1","Zen+Kaku+Gothic+New"],"bytes":16472},{"f":"404-stamp.html","nm":"重ねると","sb":"四枚そろえると、一枚が立ち上がる","grp":5,"mv":"","era":"","pal":["#FAF4E6","#241F16","#B4562F","#9A9078"],"hex":["#FAF4E6","#E9DFC5","#241F16","#5C5443","#9A9078","#B4562F","#FFFDF6","#EADFC6"],"type":"見出し：Shippori Mincho B1 ／ 枚数の「〇／四」は漢数字","layout":"上に文言、下に盤。盤の中央に「404」の空き枠、まわりに四枚のカードが散っている。","motion":"カードを空き枠へ運ぶ（ドラッグ、またはタップ／Enter）。四枚そろうと枠が消えて、デフォルメしていない一枚が立ち上がり、見出しも「見つからないものは、見つかりません。」に入れ替わる。九秒ほど放置すると、ひとりでに一度だけ実演して元に戻る。","note":"ねらい。集めても目的の頁は出てこない、と最初から言い切っている案。それでも四枚そろえると絵だけは変わるので、「変わるのは、絵だけです」と本文で認めてしまった。放っておくと勝手に一度だけ手本を見せるのは、何をすればいいか分からない人を置き去りにしないため。カードは好きな位置に置いたままにもできる。","tech":["filter","keyframes","js","pointer","grid"],"kf":1,"fonts":["Shippori+Mincho+B1","Zen+Kaku+Gothic+New"],"bytes":14271}];</script>
<script>
(function(){
  var GRP = {
    1:'一　くらしに置き換える',
    2:'二　画面と標識',
    3:'三　手を動かす',
    4:'四　様式をあてる',
    5:'五　はじめの四案'
  };
  var TECHJA = {
    canvas:'canvas 描画', mask:'CSS マスク', 'mix-blend':'ブレンドモード', 'clip-path':'clip-path',
    svg:'SVG', filter:'CSS フィルタ', conic:'円錐グラデーション', backdrop:'背景ぼかし',
    audio:'音声', js:'JavaScript', pointer:'カーソル追従', '3d':'3D 変形', scroll:'スクロール連動',
    grid:'CSS グリッド', sticky:'sticky', video:'動画', webgl:'WebGL', keyframes:''
  };

  var rail=document.getElementById('rail'), box=document.getElementById('box'), ph=document.getElementById('ph'),
      urlEl=document.getElementById('url'), spec=document.getElementById('spec'), note=document.getElementById('note'),
      nmEl=document.getElementById('nm'), noEl=document.getElementById('no'), mvEl=document.getElementById('mv'),
      eraEl=document.getElementById('era'), q=document.getElementById('q'),
      ov=document.getElementById('ov'), ovbox=document.getElementById('ovbox');
  var frame=null, cur=0;

  // ---- rail ----
  var html='', lastGrp=null;
  ENTRIES.forEach(function(d,i){
    if(d.grp!==lastGrp){ html+='<div class="grp">'+GRP[d.grp]+'</div>'; lastGrp=d.grp; }
    // 番号のないファイルは短い符丁にする（枠からはみ出させない）
    var SHORT={rooftop2:'roof'};
    var slug=d.f.replace(/^404-/,'').replace(/\.html$/,'');
    var no=/^\d/.test(slug) ? slug.replace(/-.*$/,'') : (SHORT[slug.replace(/-.*$/,'')]||slug.replace(/-.*$/,''));
    var numCls='num'+(/^\d/.test(no)?'':' w');
    html+='<button class="tab" role="tab" aria-selected="'+(i===0)+'" data-i="'+i+'" data-q="'+
      (d.f+' '+d.nm+' '+d.sb+' '+(d.mv||'')).toLowerCase()+'">'+
      '<span class="'+numCls+'">'+no+'</span>'+
      '<span class="nm">'+d.nm+'</span>'+
      '<span class="sub">'+d.sb+'</span></button>';
  });
  rail.innerHTML = html + '<p class="empty" id="empty" hidden>該当なし。</p>';
  var tabs=[].slice.call(rail.querySelectorAll('.tab'));

  // ---- stage sizing ----
  function fit(host, iframe, availH){
    if(!iframe) return;
    var w = host.clientWidth || host.parentNode.clientWidth;
    var s = w/1280;
    if(availH) s = Math.min(s, availH/800);
    iframe.style.transform = 'scale('+s+')';
    host.style.height = (800*s)+'px';
    host.style.width  = (1280*s)+'px';
  }
  function sizeAll(){
    fit(box, frame, null);
    if(ov.classList.contains('on')){
      var oi = ovbox.querySelector('iframe');
      var w = Math.min(window.innerWidth-40, 1280), h = window.innerHeight-80;
      var s = Math.min(w/1280, h/800);
      if(oi){ oi.style.transform='scale('+s+')'; ovbox.style.width=(1280*s)+'px'; ovbox.style.height=(800*s)+'px'; }
    }
  }
  window.addEventListener('resize', sizeAll);

  function mount(d){
    box.innerHTML = '';
    box.appendChild(ph);
    ph.hidden = false;
    frame = document.createElement('iframe');
    frame.setAttribute('loading','eager');
    frame.setAttribute('title', d.nm);
    frame.addEventListener('load', function(){ ph.hidden = true; });
    frame.src = d.f;
    box.appendChild(frame);
    fit(box, frame, null);
    requestAnimationFrame(function(){ fit(box, frame, null); });
  }

  function esc(s){ return String(s==null?'':s); }

  function render(i){
    cur = i;
    var d = ENTRIES[i];
    tabs.forEach(function(t){
      var on = +t.dataset.i === i;
      t.setAttribute('aria-selected', String(on));
      if(on) t.scrollIntoView({block:'nearest'});
    });
    noEl.textContent = d.f.replace('.html','');
    nmEl.textContent = d.nm;
    mvEl.textContent = d.mv || d.sb;
    if(d.era){ eraEl.textContent = d.era; eraEl.hidden = false; } else { eraEl.hidden = true; }
    urlEl.textContent = 'https://takanawa-shakuhachi.example/404/' + d.f;

    var tech = d.tech.filter(function(t){ return TECHJA[t]; }).map(function(t){ return '<b>'+TECHJA[t]+'</b>'; }).join('');
    if(d.kf) tech += '<b>@keyframes ×'+d.kf+'</b>';
    var kb = d.bytes ? (Math.round(d.bytes/102.4)/10)+' KB' : '';

    var cells = '';
    cells += '<div><dt>配色</dt><dd>'+d.pal.join(' · ')+
      '<span class="sw">'+d.pal.map(function(c){return '<i style="background:'+c+'"></i>';}).join('')+'</span>'+
      (d.hex && d.hex.length ? '<span class="hex">実測：'+d.hex.slice(0,6).join(' ')+'</span>' : '')+'</dd></div>';
    if(d.type)   cells += '<div><dt>書体</dt><dd>'+esc(d.type)+'</dd></div>';
    if(d.layout) cells += '<div><dt>レイアウト</dt><dd>'+esc(d.layout)+'</dd></div>';
    if(d.motion) cells += '<div><dt>動きのしくみ</dt><dd>'+esc(d.motion)+'</dd></div>';
    cells += '<div><dt>技法・実装</dt><dd>'+
      (d.fonts && d.fonts.length ? '読み込み書体：'+d.fonts.map(function(f){return f.replace(/\+/g,' ');}).join('、')+'<br>' : '')+
      (kb ? 'HTML 単体で '+kb : '')+
      '<span class="tags">'+tech+'</span></dd></div>';
    spec.innerHTML = cells;

    note.innerHTML = '<b>狙い。</b>' + d.note.replace(/^<b>ねらい。<\/b>/,'').replace(/^ねらい。/,'');
    mount(d);
  }

  rail.addEventListener('click', function(e){
    var t = e.target.closest('.tab');
    if(t) render(+t.dataset.i);
  });
  rail.addEventListener('keydown', function(e){
    if(e.key!=='ArrowDown' && e.key!=='ArrowUp') return;
    var vis = tabs.filter(function(t){ return !t.hidden; });
    var pos = vis.indexOf(document.activeElement.closest('.tab'));
    if(pos<0) return;
    e.preventDefault();
    var nx = vis[pos + (e.key==='ArrowDown'?1:-1)];
    if(nx){ nx.focus(); render(+nx.dataset.i); }
  });

  document.getElementById('reload').addEventListener('click', function(){ mount(ENTRIES[cur]); });
  document.getElementById('rnd').addEventListener('click', function(){
    var vis = tabs.filter(function(t){ return !t.hidden; });
    if(!vis.length) return;
    render(+vis[Math.floor(Math.random()*vis.length)].dataset.i);
  });

  q.addEventListener('input', function(){
    var v = q.value.trim().toLowerCase(), n = 0;
    tabs.forEach(function(t){
      var hide = v && t.dataset.q.indexOf(v) < 0;
      t.hidden = hide;
      if(!hide) n++;
    });
    document.getElementById('empty').hidden = n > 0;
    [].forEach.call(rail.querySelectorAll('.grp'), function(g){
      var any = false, el = g.nextElementSibling;
      while(el && el.classList.contains('tab')){ if(!el.hidden) any = true; el = el.nextElementSibling; }
      g.hidden = !any;
    });
  });

  // ---- overlay ----
  function openOv(){
    var d = ENTRIES[cur];
    ovbox.innerHTML = '';
    var f = document.createElement('iframe');
    f.style.cssText = 'width:1280px;height:800px;border:0;display:block;transform-origin:top left;background:#fff';
    f.src = d.f;
    f.setAttribute('title', d.nm);
    ovbox.appendChild(f);
    ov.classList.add('on');
    sizeAll();
    document.getElementById('close').focus();
  }
  function closeOv(){ ov.classList.remove('on'); ovbox.innerHTML=''; }
  document.getElementById('zoom').addEventListener('click', openOv);
  document.getElementById('close').addEventListener('click', closeOv);
  ov.addEventListener('click', function(e){ if(e.target===ov) closeOv(); });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape' && ov.classList.contains('on')) closeOv(); });


  // ---- 見た目：配色と明暗。どちらも即時に反映し、端末ごとに覚える ----
  (function(){
    var root=document.documentElement;
    var skins=document.getElementById('skins'), modes=document.getElementById('modes');
    var sBtn=[].slice.call(skins.querySelectorAll('button'));
    var mBtn=[].slice.call(modes.querySelectorAll('button'));
    var noteEl=document.getElementById('skinnote');
    function store(k,v){ try{ v?localStorage.setItem(k,v):localStorage.removeItem(k); }catch(e){} }
    function load(k){ try{ return localStorage.getItem(k)||''; }catch(e){ return ''; } }
    function skin(k,save){
      if(k) root.setAttribute('data-skin',k); else root.removeAttribute('data-skin');
      var hit=null;
      sBtn.forEach(function(b){ var on=b.dataset.k===(k||''); b.setAttribute('aria-pressed',String(on)); if(on) hit=b; });
      if(hit && noteEl) noteEl.textContent='配色「'+hit.dataset.name+'」——'+hit.dataset.sub+'。';
      if(save!==false) store('daicho-skin',k);
    }
    function mode(m,save){
      if(m==='light'||m==='dark') root.setAttribute('data-theme',m); else root.removeAttribute('data-theme');
      mBtn.forEach(function(b){ b.setAttribute('aria-pressed',String(b.dataset.m===(m||''))); });
      if(save!==false) store('daicho-theme',m);
    }
    skin(window.PRESET_SKIN || load('daicho-skin'), !!window.PRESET_SKIN);
    mode(load('daicho-theme'),false);
    skins.addEventListener('click',function(e){ var b=e.target.closest('button'); if(b) skin(b.dataset.k); });
    modes.addEventListener('click',function(e){ var b=e.target.closest('button'); if(b) mode(b.dataset.m); });
    // 色玉に触れているあいだは、その配色の名前を下の行に出す（押さなくても分かるように）
    function say(b){ if(noteEl&&b) noteEl.textContent='配色「'+b.dataset.name+'」——'+b.dataset.sub+'。'; }
    skins.addEventListener('mouseover',function(e){ var b=e.target.closest('button'); if(b) say(b); });
    skins.addEventListener('focusin',function(e){ var b=e.target.closest('button'); if(b) say(b); });
    function restore(){ say(skins.querySelector('button[aria-pressed="true"]')); }
    skins.addEventListener('mouseleave',restore);
    skins.addEventListener('focusout',restore);
  })();

  document.getElementById('fnote').textContent =
    '全 ' + ENTRIES.length + ' 枚。左の列で選ぶと、下の欄が入れ替わります。「はじめから」で読み込み直すと、入ったときの動きをもう一度見られます。';

  render(0);
})();
</script>
