<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>404 ｜ この頁は、まだ区画されていない</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=Shippori+Mincho+B1:wght@400;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overflow-x:clip}
html,body{margin:0;padding:0}
img{width:auto;height:auto;max-width:100%;display:block}
a{color:inherit}

:root{
  --g:clamp(6px,1vw,13px);
  --ink:#16161A;
  --w:#F2F0E9;
  --r:#D62828;
  --b:#1E4FD8;
  --y:#F3C31A;
}
body{
  height:100svh;min-height:520px;display:flex;flex-direction:column;
  padding:var(--g);overflow:hidden;
  background:var(--ink);color:var(--ink);
  font-family:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}

.grid{
  flex:1 1 auto;min-height:0;
  display:grid;gap:var(--g);
  grid-template-columns:0.329fr 0.358fr 0.313fr;
  grid-template-rows:0.578fr 0.219fr 0.203fr;
  transition:grid-template-columns 1.5s cubic-bezier(.68,0,.18,1),
             grid-template-rows 1.5s cubic-bezier(.68,0,.18,1);
}
.cell{position:relative;min-width:0;min-height:0;overflow:hidden;
  transition:background-color 1.1s ease}
.w{background:var(--w)} .r{background:var(--r)} .b{background:var(--b)} .y{background:var(--y)}

.fig{grid-area:1/1/3/2}
.big{grid-area:1/2/2/4}
.c1{grid-area:2/2/3/3}
.c2{grid-area:2/3/3/4}
.c3{grid-area:3/1/4/2}
.cop{grid-area:3/2/4/4}

.fig img{width:100%;height:100%;object-fit:cover;object-position:50% 14%;
  filter:saturate(.92) contrast(1.06)}

.big{display:flex;flex-direction:column;justify-content:space-between;
  padding:clamp(10px,1.6vw,26px)}
.lab{align-self:flex-end;font-size:clamp(9px,.9vw,11px);letter-spacing:.3em;opacity:.62;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.num{font-size:clamp(58px,min(13.5vw,21svh),192px);font-weight:800;
  letter-spacing:-.055em;line-height:.9}

.cop{display:flex;flex-direction:column;justify-content:center;gap:4px;
  padding:clamp(10px,1.6vw,28px)}
.cop .ja{font-family:"Shippori Mincho B1",serif;
  font-size:clamp(14px,min(1.7vw,2.6svh),22px);letter-spacing:.05em}
.cop .en{font-size:clamp(9px,.95vw,12px);letter-spacing:.26em;opacity:.6;margin-top:2px}
.cop a{margin-top:clamp(6px,1vw,13px);align-self:flex-start;
  font-size:clamp(10px,1.05vw,13px);letter-spacing:.2em;text-decoration:none;
  border-bottom:3px solid var(--r);padding-bottom:2px}
.cop a:hover{background:var(--r);color:var(--w);border-bottom-color:var(--ink)}

/* 狭い画面：区画の数を減らして縦に積む */
@media (max-width:820px){
  .grid{
    grid-template-columns:1fr 1fr;
    grid-template-rows:minmax(0,1.35fr) minmax(0,0.9fr) minmax(0,0.42fr) minmax(0,0.9fr);
    transition:none;
  }
  .fig{grid-area:1/1/2/3}
  .big{grid-area:2/1/3/3}
  .c1{grid-area:3/1/4/2}
  .c2{grid-area:3/2/4/3}
  .c3{display:none}
  .cop{grid-area:4/1/5/3}
  .num{font-size:clamp(62px,min(20vw,16svh),150px)}
  .lab{align-self:flex-start}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important}
}
</style>
</head>
<body>

<main class="grid">
  <div class="cell w fig"><img src="/404/404-30-stijl/q2.webp" alt="" width="279" height="620" decoding="async"></div>
  <div class="cell w big">
    <span class="lab">COMPOSITIE No. 404</span>
    <div class="num">404</div>
  </div>
  <div class="cell r c1"></div>
  <div class="cell b c2"></div>
  <div class="cell y c3"></div>
  <div class="cell w cop">
    <div class="ja">この頁は、まだ区画されていない。</div>
    <div class="en">DE PAGINA BESTAAT NIET</div>
    <a href="/?from=404-30-stijl">← TERUG ／ 表紙へ</a>
  </div>
</main>

<script>
(function(){
  var grid=document.querySelector('.grid');
  var cells=[document.querySelector('.c1'),document.querySelector('.c2'),document.querySelector('.c3')];
  var COL=['r','b','y'];
  /* 元の区画線（1280x800・溝13px）を割合に直したもの */
  var P=[
    {c:[417,454,396], r:[455,172,160]},
    {c:[509,304,454], r:[365,240,182]},
    {c:[363,554,350], r:[511,138,138]}
  ];
  var n=0;
  function fr(a){
    var t=a[0]+a[1]+a[2];
    return a.map(function(v){return (v/t).toFixed(4)+'fr';}).join(' ');
  }
  function apply(){
    var p=P[n%P.length];
    grid.style.gridTemplateColumns=fr(p.c);
    grid.style.gridTemplateRows=fr(p.r);
    var k=n%3;
    cells.forEach(function(c,i){
      if(!c) return;
      c.className='cell '+COL[(i+k)%3]+' c'+(i+1);
    });
    n++;
  }
  apply();
  var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(!reduce) setInterval(apply,5400);
  window.addEventListener('resize',function(){});
})();
</script>
</body>
</html>
