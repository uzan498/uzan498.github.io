<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>404 ｜ お探しのページが見つかりませんでした</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;800&family=IBM+Plex+Mono:wght@400;600&family=Shippori+Mincho+B1:wght@400;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overflow-x:clip}
html,body{margin:0;padding:0}
img{width:auto;height:auto;max-width:100%;display:block}
a{color:inherit}

:root{
  --pad:clamp(16px,3.2vw,58px);
  --ink:#14120E;
  --canvas:#CFC3A6;
  --hot:#C3392B;
}
body{
  height:100svh;min-height:460px;display:flex;flex-direction:column;
  padding:var(--pad);gap:10px;
  overflow:hidden;background:var(--canvas);color:var(--ink);cursor:crosshair;
  font-family:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
/* 生地の目 */
.tex{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
  background-image:repeating-linear-gradient(90deg,rgba(90,74,44,.10) 0 1px,transparent 1px 3px),
                   repeating-linear-gradient(0deg,rgba(90,74,44,.10) 0 1px,transparent 1px 3px)}
/* 版で刷った像。塗る前から画布の上にある */
.ink{position:fixed;z-index:1;pointer-events:none;background:#1B1712;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  -webkit-mask-size:contain;mask-size:contain;
  -webkit-mask-position:center;mask-position:center;
  animation:enFade .8s ease backwards}
.i1{left:6%;top:14%;width:min(41%,52svh);height:min(70%,56svh);opacity:.88}
.i2{right:8%;top:26%;width:min(22%,28svh);height:min(50%,40svh);background:#8E3A2A;opacity:.8;
  transform:rotate(3deg)}
.i3{display:none;left:52%;bottom:6%;width:min(20%,24svh);height:min(38%,30svh);
  background:#23458C;opacity:.55;transform:rotate(-6deg)}
.num{position:fixed;left:50%;top:50%;z-index:1;pointer-events:none;translate:-50% -50%;
  font-family:"Anton",Impact,sans-serif;font-size:var(--nf,240px);line-height:.86;
  letter-spacing:.02em;color:rgba(20,18,14,.9);white-space:nowrap;
  animation:enFade .8s ease backwards}
@keyframes enFade{from{opacity:0}to{opacity:1}}
/* 絵具はいちばん上に落ちる */
.cv{position:fixed;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}

.head,.main,.foot{position:relative;z-index:3}
.head{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:10px 18px;
  align-items:flex-start;justify-content:space-between}
.t{font-family:"Anton",Impact,sans-serif;font-size:clamp(11px,1.2vw,15px);letter-spacing:.42em;
  white-space:nowrap}
.tag{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:clamp(9px,.95vw,11px);
  letter-spacing:.2em;color:#5A4A2C;text-align:right;line-height:2;white-space:nowrap}
.main{flex:1 1 auto;min-height:100px}
.foot{flex:0 0 auto;display:flex;flex-wrap:wrap;align-items:flex-end;
  justify-content:space-between;gap:10px 18px}
.say{font-family:"Shippori Mincho B1",serif;font-size:clamp(14px,min(1.7vw,2.6svh),21px);
  letter-spacing:.12em;background:rgba(233,224,200,.82);padding:8px 14px;display:inline-block}
.link{display:inline-block;margin-top:8px;font-size:clamp(10px,1.05vw,12px);letter-spacing:.24em;
  text-transform:uppercase;text-decoration:none;border-bottom:2px solid var(--hot);
  background:rgba(233,224,200,.82);padding:6px 12px}
.link:hover{background:var(--hot);color:#E9E0C8;border-bottom-color:var(--ink)}
.hint{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:clamp(10px,1vw,11.5px);
  letter-spacing:.14em;color:#E9E0C8;background:var(--ink);padding:7px 13px;white-space:nowrap}

/* 画布が広いほど、版も投げる絵具も増える */
@media (min-width:1340px){ .i3{display:block} }
@media (max-width:620px){ .tag{display:none} }
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important}
}
/* 指でなぞる案。ブラウザにスクロール等でジェスチャを奪わせない */
body{touch-action:none;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
a{touch-action:manipulation}
</style>
</head>
<body>

<div class="tex" aria-hidden="true"></div>
<div class="ink i1" id="i1" aria-hidden="true"></div>
<div class="ink i2" id="i2" aria-hidden="true"></div>
<div class="ink i3" id="i3" aria-hidden="true"></div>
<div class="num" id="num" aria-hidden="true">404</div>
<canvas class="cv" aria-hidden="true"></canvas>

<header class="head">
  <div class="t">Uh oh, this page went missing</div>
  <div class="tag">raw canvas<br>enamel, screened image<br>no composition</div>
</header>

<main class="main"></main>

<footer class="foot">
  <div>
    <div class="say">We couldn't find that page, but you can paint here instead.</div><br>
    <a class="link" href="/?from=404-41-action">← back to the wall</a>
  </div>
  <div class="hint" id="hint">Click to change colors.</div>
</footer>

<script>
(function(){
  /* 指では pointerdown を捕まえておかないと、なぞっている途中で移動が届かなくなる */
  function grab(e){
    if(e.target.closest('a')) return;
    if(e.cancelable) e.preventDefault();
    try{ document.body.setPointerCapture(e.pointerId); }catch(_){}
  }
  window.addEventListener('pointerdown',grab,{passive:false});
  var DIR='/404/404-41-action/';
  ['i1','i2'].forEach(function(id,k){
    var el=document.getElementById(id);
    var u='url("'+DIR+(k===0?'ht_a':'ht_c')+'.webp")';
    el.style.webkitMaskImage=u; el.style.maskImage=u;
  });
  var i3=document.getElementById('i3');
  var u3='url("'+DIR+'ht_c.webp")'; i3.style.webkitMaskImage=u3; i3.style.maskImage=u3;

  var cv=document.querySelector('.cv'), g=cv.getContext('2d');
  var num=document.getElementById('num');
  var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  var touch=!matchMedia('(hover:hover)').matches;
  if(touch){ var hn=document.getElementById('hint'); if(hn) hn.textContent='速く指を滑らせるほど、絵具が飛ぶ'; }

  var W=1,H=1,DPR=1,K=1;
  var COLS=['#14120E','#C3392B','#F2EDE0','#23458C','#C98B2A','#2E7A6B','#14120E','#8E3A2A'];
  var col=COLS[0], ci=0;

  /* 404 は欄の実寸から決める（代替フォントでも溢れない） */
  var mc=document.createElement('canvas').getContext('2d');
  function fitNum(){
    mc.font='800 100px Anton, Impact, sans-serif';
    if('letterSpacing' in mc) mc.letterSpacing='2px';
    var w100=(mc.measureText('404').width||160)/100;
    var byW=(document.documentElement.clientWidth*0.82)/w100;
    var byH=document.documentElement.clientHeight*0.46;
    num.style.setProperty('--nf',Math.floor(Math.max(56,Math.min(320,Math.min(byW,byH))))+'px');
  }

  function size(){
    DPR=Math.min(window.devicePixelRatio||1,1.5);
    W=Math.max(1,Math.round(cv.clientWidth)); H=Math.max(1,Math.round(cv.clientHeight));
    var old=null;
    if(cv.width>1&&cv.height>1){ old=document.createElement('canvas');
      old.width=cv.width; old.height=cv.height; old.getContext('2d').drawImage(cv,0,0); }
    cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
    g.setTransform(DPR,0,0,DPR,0,0);
    /* 画面を変えても、塗った跡は伸ばして残す */
    if(old) g.drawImage(old,0,0,old.width/DPR,old.height/DPR,0,0,W,H);
    K=Math.max(0.55,Math.min(2.2,Math.min(W/1280,H/800)));
    fitNum();
  }

  function drop(x,y,r,c,a){
    g.globalAlpha=a===undefined?1:a; g.fillStyle=c;
    g.beginPath();
    var n=9; g.moveTo(x+r,y);
    for(var i=1;i<=n;i++){
      var th=i/n*6.283, rr=r*(0.72+Math.random()*0.56);
      g.lineTo(x+Math.cos(th)*rr, y+Math.sin(th)*rr);
    }
    g.closePath(); g.fill(); g.globalAlpha=1;
  }
  function stroke(x0,y0,x1,y1,w,c){
    g.strokeStyle=c; g.lineWidth=w; g.lineCap='round';
    g.beginPath(); g.moveTo(x0,y0);
    var mx=(x0+x1)/2+(Math.random()-.5)*30*K, my=(y0+y1)/2+(Math.random()-.5)*30*K;
    g.quadraticCurveTo(mx,my,x1,y1); g.stroke();
  }
  function fling(x,y,vx,vy,c){
    var sp=Math.min(70*K,Math.hypot(vx,vy));
    stroke(x-vx*0.6,y-vy*0.6,x,y,Math.max(1.3,sp*0.11),c);
    var n=Math.min(12,1+Math.round(sp*0.24/K));
    for(var i=0;i<n;i++){
      var a=Math.atan2(vy,vx)+(Math.random()-.5)*0.9;
      var d=Math.random()*sp*1.4;
      var px=x+Math.cos(a)*d, py=y+Math.sin(a)*d;
      drop(px,py,(Math.random()*4.4+0.9)*K,c,.55+Math.random()*.45);
      if(Math.random()<0.07){
        var len=(10+Math.random()*64)*K;
        g.strokeStyle=c; g.lineWidth=(Math.random()*3.4+1.2)*K; g.lineCap='round';
        g.beginPath(); g.moveTo(px,py); g.lineTo(px+(Math.random()-.5)*7*K,py+len); g.stroke();
        drop(px+(Math.random()-.5)*7*K,py+len,(Math.random()*3+1.2)*K,c,.9);
      }
    }
  }
  function splat(x,y,c){
    drop(x,y,(26+Math.random()*22)*K,c,.96);
    for(var i=0;i<40;i++){
      var a=Math.random()*6.283,d=Math.random()*170*K+18;
      drop(x+Math.cos(a)*d,y+Math.sin(a)*d,(Math.random()*7+1)*K,c,.5+Math.random()*.5);
    }
    for(var j=0;j<7;j++){
      var a2=Math.random()*6.283,d2=Math.random()*80*K+20;
      var px=x+Math.cos(a2)*d2, py=y+Math.sin(a2)*d2, len=(40+Math.random()*160)*K;
      g.strokeStyle=c; g.lineWidth=(Math.random()*5+2)*K; g.lineCap='round';
      g.beginPath(); g.moveTo(px,py); g.lineTo(px+(Math.random()-.5)*16*K,py+len); g.stroke();
    }
  }

  /* 到着時：画布の前で何度か絵具を投げる。広い画布ほど一投多い */
  var THROWS=[
    {c:'#14120E',pts:[[-.03,.27],[.23,.17],[.50,.37],[.77,.22],[1.03,.40]]},
    {c:'#C3392B',pts:[[1.04,.75],[.70,.65],[.41,.82],[.12,.67],[-.03,.80]]},
    {c:'#F2EDE0',pts:[[.16,-.05],[.33,.37],[.23,.75],[.50,.95],[.78,.65]]},
    {c:'#C98B2A',pts:[[1.02,.07],[.67,.30],[.47,.15],[.19,.52]]},
    {c:'#23458C',pts:[[-.02,.05],[.30,.55],[.62,.30],[.92,.88]]}
  ];
  function bez(pts,t){
    var n=pts.length-1, i=Math.min(n-1,Math.floor(t*n)), f=t*n-i;
    var a=pts[i],b=pts[i+1];
    return [(a[0]+(b[0]-a[0])*f)*W, (a[1]+(b[1]-a[1])*f)*H];
  }
  function throwsN(){ return innerWidth>=1340 ? 5 : 4; }
  function paintAll(){
    var N=throwsN();
    for(var k=0;k<N;k++){
      var th=THROWS[k];
      for(var s=0;s<40;s++){
        var t=s/40;
        var p1=bez(th.pts,t), p2=bez(th.pts,Math.min(1,t+0.02));
        fling(p1[0],p1[1],(p2[0]-p1[0])*1.15,(p2[1]-p1[1])*1.15,th.c);
      }
    }
  }
  var t0=null, phase=0, drawn=0;
  function intro(ts){
    if(t0===null) t0=ts;
    var el=(ts-t0)/1000, per=0.72, N=throwsN();
    if(phase<N && el>phase*per){
      var th=THROWS[phase];
      var local=Math.min(1,(el-phase*per)/per);
      while(drawn<local){
        var t=Math.min(1,drawn);
        var p1=bez(th.pts,t), p2=bez(th.pts,Math.min(1,t+0.022));
        fling(p1[0],p1[1],(p2[0]-p1[0])*1.15,(p2[1]-p1[1])*1.15,th.c);
        drawn+=0.018;
      }
      if(local>=1){ phase++; drawn=0; }
    }
    if(el<N*per+0.3) requestAnimationFrame(intro);
  }

  window.addEventListener('resize',size);
  size();
  if(reduce) paintAll(); else requestAnimationFrame(intro);

  var last=null;
  function pos(e){ var r=cv.getBoundingClientRect();
    return [e.clientX-r.left, e.clientY-r.top]; }
  function move(e){
    var p=pos(e);
    if(last){
      var vx=p[0]-last[0], vy=p[1]-last[1];
      if(Math.hypot(vx,vy)>3) fling(p[0],p[1],vx,vy,col);
    }
    last=p;
  }
  function down(e){
    if(e.target.closest('a')) return;
    ci=(ci+1)%COLS.length; col=COLS[ci];
    var p=pos(e); splat(p[0],p[1],col); last=p;
  }
  window.addEventListener('pointermove',move,{passive:true});
  window.addEventListener('pointerdown',down);
  window.addEventListener('pointerleave',function(){ last=null; });
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fitNum).catch(function(){});
})();
</script>
</body>
</html>
