<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}

a{color:inherit}

.glow{position:fixed;inset:0;z-index:0;background:

.por{position:fixed;right:0;top:0;width:min(50vw,640px);height:100svh;object-fit:cover;

.por.on{opacity:1}
/* 覆いは本文カラムの実寸に連動 */
.veil{position:fixed;inset:0;z-index:2;pointer-events:none;background:
  linear-gradient(90deg,rgba(10,17,32,.9) 0,

.ply{position:relative;z-index:5;width:var(--colw);max-width:100%}
.now{margin:0 0 clamp(12px,2.6vh,22px);font-size:clamp(9px,.86vw,12px);letter-spacing:.3em;color:#8FA3C0}
.now b{color:var(--cy);font-weight:700}
.top{display:flex;gap:clamp(12px,1.8vw,22px);align-items:flex-end}

.seek{margin-top:clamp(14px,2.8vh,26px)}
.tr{height:4px;background:rgba(233,238,246,.18);border-radius:2px;position:relative;cursor:pointer;touch-action:none}
.tr:before{content:"";position:absolute;left:0;right:0;top:-12px;bottom:-12px}  /* 指で掴める幅 */
.tr u{position:absolute;left:0;top:0;height:4px;border-radius:2px;background:var(--cy);

  background:var(--cy);box-shadow:0 0 14px rgba(127,212,255,.8)}

.ctr button.pl{width:clamp(44px,4.4vw,56px);background:#E9EEF6;color:#0A1120;border-color:#E9EEF6;

.ctr svg{width:38%;height:38%;fill:currentColor;display:block}
.ctr button.pl svg{width:40%;height:40%;margin-left:6%}
.ctr button.pl.on svg{margin-left:0}
.vol{display:flex;align-items:center;gap:8px;margin-left:auto}
.vol input{width:clamp(70px,8vw,110px);accent-color:var(--cy);cursor:pointer;margin:0}

.ctr{flex-wrap:wrap}
.msg{margin:10px 0 0;font-size:clamp(9.5px,.86vw,12px);color:#8FA3C0;letter-spacing:.06em;min-height:1.4em}

.ask button{font:inherit;font-size:clamp(12px,1vw,14px);letter-spacing:.06em;cursor:pointer;

.eqw{display:flex;align-items:flex-end;gap:4px;height:26px;margin-left:10px}
.eqw i{width:4px;background:var(--cy);border-radius:2px;height:6px}

@keyframes eq{to{height:24px}}

main{position:relative;z-index:5;flex:1;display:flex;align-items:flex-end;
  padding-block:clamp(14px,3vh,40px)}

   .on の 6px ずらし分だけ内側に余白を取る（親からはみ出させない） */
.ly{width:min(46vw,600px);max-width:100%;padding-right:8px;

.lyi{transition:transform .55s cubic-bezier(.3,.9,.3,1)}

.ly p.on{color:#FFFFFF;border-left-color:var(--cy);transform:translateX(6px)}
.links{position:relative;z-index:5;display:flex;flex-wrap:wrap;gap:clamp(12px,1.7vw,22px);

.links a{text-decoration:none;color:#E9EEF6;font-size:clamp(11px,min(1.06vw,1.7vh),16px);

.links a.on{color:var(--cy);border-bottom-color:rgba(127,212,255,.6)}

@media (max-height:620px){ .ly{height:clamp(58px,17svh,130px)} }
@media (prefers-reduced-motion:reduce){ .eqw i{animation:none !important}
  .ly p,.lyi{transition:none} }

/* 採時モード（?tap=1 で開いたときだけ出る道具） */
.tap{position:fixed;right:12px;top:12px;z-index:30;width:min(300px,calc(100vw - 24px));

</style>

    bmu=document.querySelector('.mu'), ion=bmu.querySelector('.i-on'), ioff=bmu.querySelector('.i-off'),
    vr=document.querySelector('.vr');
var ti=0, li=0, playing=false, iv=null, asked=false, lps=[];
var TAP=/[?&]tap=1/.test(location.search);
var tapReset=function(){};

function swap(key){
  var src=P+key+'.webp';
  var show=pa.classList.contains('on')?pb:pa, hide=pa.classList.contains('on')?pa:pb;
  if(hide.getAttribute('src')===src) return;
  function go(){ show.classList.add('on'); hide.classList.remove('on'); }
  if(show.getAttribute('src')===src){ go(); return; }
  show.src=src;
  if(show.complete && show.naturalWidth) go(); else show.onload=go;
}
function mmss(x){ x=Math.max(0,Math.round(x)); return Math.floor(x/60)+':'+('0'+x%60).slice(-2); }
function clock(){
  var d=au.duration, c=au.currentTime||0;
  if(d&&isFinite(d)){ fill.style.width=(c/d*100).toFixed(2)+'%'; el.textContent=mmss(c); rl.textContent='-'+mmss(d-c); }
  else{ fill.style.width='0%'; el.textContent='0:00'; rl.textContent='-:--'; }
}

/* ---- 歌詞 ---- */
function timed(T){ return T.ls.length>0 && typeof T.ls[0].t==='number'; }
function lineAt(T,tm){
  var i=0;
  for(var k=0;k<T.ls.length;k++){
    var u=T.ls[k].t;
    if(k>0 && !(u>0)) break;   /* まだ秒を測っていない行。ここから先へは進まない */
    if(u<=tm) i=k; else break;
  }
  return i;
}
/* まだ秒の入っていない最初の行。採時はそこから続ける */
function firstBlank(T){
  for(var k=0;k<T.ls.length;k++){ if(!(T.ls[k].t>0)) return k; }
  return T.ls.length;
}
/* 絵を持たない行は、手前でいちばん近い絵をそのまま使う */
function imgAt(T,i){
  for(var k=i;k>=0;k--){ if(T.ls[k].img) return T.ls[k].img; }
  return null;
}
function build(){
  inner.innerHTML='';
  TRACKS[ti].ls.forEach(function(x){
    var q=document.createElement('p'); q.textContent=x.l; inner.appendChild(q);
  });
  lps=[].slice.call(inner.children);
}
/* いま歌っている行が窓の上から4分の1あたりに来るまで、中身をずらす */
function slide(){
  var cur=lps[li]; if(!cur) return;
  var max=Math.max(0, inner.scrollHeight - ly.clientHeight);
  var y=Math.min(max, Math.max(0, cur.offsetTop - ly.clientHeight*0.26));
  inner.style.transform='translateY('+(-y).toFixed(1)+'px)';
}
function paint(){
  var T=TRACKS[ti];
  tt.innerHTML=T.t; ta.innerHTML=T.a;
  if(art.getAttribute('src')!==P+T.art) art.src=P+T.art;
  lps.forEach(function(q,i){ q.classList.toggle('on',i===li); });
  slide();
  var k=imgAt(T,li); if(k) swap(k);
}
function ui(){
  ipl.style.display=playing?'none':''; ipa.style.display=playing?'':'none';
  bpl.classList.toggle('on',playing);
  st.textContent=playing?'再生中':'停止中';
}
/* 歌詞と絵は、音が鳴っていてもいなくても勝手に送り続ける（再生ボタンは音だけ）。
   秒を持つ曲を鳴らしているあいだだけ、この送りを止めて時刻に合わせる */
document.body.classList.add('playing');
function run(){
  clearInterval(iv); iv=null;
  if(TAP) return;
  if(playing && timed(TRACKS[ti])) return;
  iv=setInterval(function(){ li=(li+1)%TRACKS[ti].ls.length; paint(); },3400);
}
function sync(){
  var T=TRACKS[ti]; if(!timed(T)) return;
  var i=lineAt(T,au.currentTime||0);
  if(i!==li){ li=i; paint(); }
}

function load(){
  var want=P+TRACKS[ti].src;
  if(au.getAttribute('src')!==want){ au.setAttribute('src',want); au.load(); }
  msg.textContent=''; clock();
}
function play(){
  load();
  var q=au.play();
  if(q&&q.then) q.catch(function(){ /* 失敗の中身は error / pause の側で拾う */ });
}
function stop(){ playing=false; ui(); run(); }

au.addEventListener('play',function(){ playing=true; ui(); run(); });
au.addEventListener('pause',function(){ if(!au.ended) stop(); });
/* 終わったら次の曲へ。ここまで来ているなら一度は本人が再生を押している */
au.addEventListener('ended',function(){
  if(TAP){ stop(); return; }   /* 採時中に曲が変わると、測った秒を書き出せなくなる */
  ti=(ti+1)%TRACKS.length; li=0; build(); paint(); run(); play();
});
au.addEventListener('timeupdate',function(){ clock(); if(playing && !TAP) sync(); });
au.addEventListener('loadedmetadata',clock);
au.addEventListener('error',function(){
  stop();
  msg.textContent='音源が見つかりません（'+TRACKS[ti].src+'）。絵と歌詞だけお楽しみください。';
});

bpl.addEventListener('click',function(){
  if(playing){ au.pause(); return; }
  if(!asked){ ask.hidden=false; ask.querySelector('.ok').focus(); return; }
  play();
});
ask.querySelector('.ok').addEventListener('click',function(){ asked=true; ask.hidden=true; play(); });
ask.querySelector('.no').addEventListener('click',function(){ ask.hidden=true; });
ask.addEventListener('click',function(e){ if(e.target===ask) ask.hidden=true; });
document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&!ask.hidden) ask.hidden=true; });

function go(d){
  var was=playing;
  au.pause(); ti=(ti+d+TRACKS.length)%TRACKS.length; li=0; build(); paint(); tapReset(); run();
  if(was) play(); else { au.removeAttribute('src'); au.load(); msg.textContent=''; clock(); }
}
bnx.addEventListener('click',function(){ if(!TAP) go(1); });
bpv.addEventListener('click',function(){ if(!TAP) go(-1); });

/* 棒を押した位置・なぞった位置へ飛ぶ。音源が読めていないうちは何もしない */
function seek(e){
  var d=au.duration; if(!d||!isFinite(d)) return;
  var r=tr.getBoundingClientRect(), x=Math.min(Math.max(e.clientX-r.left,0),r.width);
  au.currentTime=x/r.width*d; clock(); if(!TAP) sync();
}
tr.addEventListener('pointerdown',function(e){
  if(e.button!==0) return;
  e.preventDefault(); try{ tr.setPointerCapture(e.pointerId); }catch(_){}
  seek(e);
});
tr.addEventListener('pointermove',function(e){ if(e.buttons&1) seek(e); });

/* 音量。iPhone は音量を触らせてくれない（値が 1 に戻る）ので、そのときはつまみを隠して消音だけ残す */
au.volume=parseFloat(vr.value);
if(au.volume!==parseFloat(vr.value)) vr.hidden=true;
function vui(){
  var off=au.muted||au.volume===0;
  ion.style.display=off?'none':''; ioff.style.display=off?'':'none';
  bmu.setAttribute('aria-pressed',String(au.muted));
}
vr.addEventListener('input',function(){ au.volume=parseFloat(vr.value); if(au.volume>0) au.muted=false; vui(); });
bmu.addEventListener('click',function(){ au.muted=!au.muted; vui(); });
vui();

/* ---- 採時モード ----
   ?tap=1 で開き、鳴らしながら行の頭で Space。最後に「書き出す」を押すと、
   そのまま上の ls に貼れる形で出てくる。 */
if(TAP){
  var box=document.getElementById('tap'); box.hidden=false;
  bnx.disabled=true; bpv.disabled=true;   /* 曲が変わると測った秒を失う */
  var tpT=box.querySelector('.tp-t'), tpI=box.querySelector('.tp-i'),
      tpN=box.querySelector('.tp-n'), tpL=box.querySelector('.tp-l'),
      tpA=box.querySelector('.tp-ta');
  var ix=firstBlank(TRACKS[ti]), seeked=false;
  function two(n){ return ('0'+n).slice(-2); }
  function fmt(x){ x=Math.max(0,x||0);
    return Math.floor(x/60)+':'+two(Math.floor(x%60))+'.'+two(Math.floor(x%1*100)); }
  function tui(){
    var T=TRACKS[ti];
    tpT.textContent=fmt(au.currentTime);
    tpI.textContent=Math.min(ix+1,T.ls.length); tpN.textContent=T.ls.length;
    tpL.textContent=T.ls[ix]?T.ls[ix].l:'（ここまで）';
  }
  function mark(){
    var T=TRACKS[ti]; if(ix>=T.ls.length) return;
    T.ls[ix].t=Math.round((au.currentTime||0)*100)/100;
    li=ix; paint(); ix++; tui();
  }
  function undo(){
    var T=TRACKS[ti]; if(ix<=0) return;
    ix--; delete T.ls[ix].t; li=ix; paint(); tui();
  }
  function quo(x){ return "'"+String(x).replace(/\\/g,'\\\\').replace(/'/g,"\\'")+"'"; }
  function dump(){
    var rows=TRACKS[ti].ls.map(function(x){
      return '   {t:'+(typeof x.t==='number'?x.t.toFixed(2):'0')+', l:'+quo(x.l)+
             (x.img?', img:'+quo(x.img):'')+'}';
    });
    tpA.hidden=false; tpA.value='  ls:[\n'+rows.join(',\n')+']';
    tpA.focus(); tpA.select();
  }
  function here(){ li=Math.max(0,Math.min(ix,TRACKS[ti].ls.length-1)); paint(); tui(); }
  tapReset=function(){ ix=firstBlank(TRACKS[ti]); seeked=false; tpA.hidden=true; here(); };
  /* 途中まで測ってある曲は、鳴らし始めたら最後に印を付けた行まで飛ぶ */
  au.addEventListener('canplay',function(){
    if(seeked) return; seeked=true;
    var T=TRACKS[ti];
    if(ix>0 && ix<T.ls.length && T.ls[ix-1].t>0) au.currentTime=T.ls[ix-1].t;
  });
  box.querySelector('.tp-top').addEventListener('click',function(){
    var T=TRACKS[ti];
    for(var k=0;k<T.ls.length;k++){ delete T.ls[k].t; }
    ix=0; tpA.hidden=true;
    if(au.duration) au.currentTime=0;
    here();
  });
  box.querySelector('.tp-mark').addEventListener('click',mark);
  box.querySelector('.tp-undo').addEventListener('click',undo);
  box.querySelector('.tp-out').addEventListener('click',dump);
  document.addEventListener('keydown',function(e){
    if(e.target && e.target.tagName==='TEXTAREA') return;
    if(e.code==='Space'){ e.preventDefault(); mark(); }
    else if(e.code==='Backspace'){ e.preventDefault(); undo(); }
  });
  setInterval(tui,100);
  here();
}

build(); paint(); run(); ui(); clock();
window.addEventListener('resize',slide);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(slide).catch(function(){});
})();
</script>
</body>
</html>
