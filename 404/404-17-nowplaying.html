<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>404 ページが見つかりません ｜ いま流れている曲</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700&family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
/* width/height 属性は CSS の width/height に効いてしまう（presentational hint）。
   幅だけ指定した画像が属性の高さで固まるので、ここで無効化しておく */
img{max-width:none;width:auto;height:auto}
a{color:inherit}
:focus-visible{outline-offset:3px}

:root{ --pad:clamp(18px,5.5vw,70px); --colw:clamp(280px,44vw,560px); --cy:#7FD4FF; }
html{background:#0A1120}
body{position:relative;min-height:100svh;overflow:hidden;
  display:flex;flex-direction:column;padding:var(--pad);
  background:#0A1120;color:#E9EEF6;
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}
.glow{position:fixed;inset:0;z-index:0;background:
  radial-gradient(70% 60% at 76% 42%,rgba(96,140,220,.22),transparent 70%),
  radial-gradient(50% 40% at 10% 86%,rgba(220,140,180,.12),transparent 70%)}
.por{position:fixed;right:0;top:0;width:min(50vw,640px);height:100svh;object-fit:cover;
  object-position:50% 34%;opacity:0;transition:opacity .6s ease;z-index:1;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 28%);
  mask-image:linear-gradient(90deg,transparent 0,#000 28%)}
.por.on{opacity:1}
/* 覆いは本文カラムの実寸に連動 */
.veil{position:fixed;inset:0;z-index:2;pointer-events:none;background:
  linear-gradient(90deg,rgba(10,17,32,.9) 0,
    rgba(10,17,32,.62) calc(var(--pad) + var(--colw) * .8),
    rgba(10,17,32,0) calc(var(--pad) + var(--colw) + 12vw))}

.ply{position:relative;z-index:5;width:var(--colw);max-width:100%}
.now{margin:0 0 clamp(12px,2.6vh,22px);font-size:clamp(9px,.86vw,12px);letter-spacing:.3em;color:#8FA3C0}
.now b{color:var(--cy);font-weight:700}
.top{display:flex;gap:clamp(12px,1.8vw,22px);align-items:flex-end}
.top img{width:clamp(72px,9.9vw,126px);aspect-ratio:1;object-fit:cover;border-radius:10px;
  box-shadow:0 18px 34px -18px #000;flex:0 0 auto}
.ti{min-width:0}
.ti h1{margin:0;font-size:clamp(19px,min(2.42vw,3.9vh),38px);font-weight:900;letter-spacing:.01em;
  line-height:1.25}
.ti p{margin:clamp(5px,1vh,9px) 0 0;font-size:clamp(10.5px,1vw,15px);color:#93A6C2;letter-spacing:.04em;
  line-height:1.7}
.seek{margin-top:clamp(14px,2.8vh,26px)}
.tr{height:4px;background:rgba(233,238,246,.18);border-radius:2px;position:relative}
.tr u{position:absolute;left:0;top:0;height:4px;border-radius:2px;background:var(--cy);
  display:block;text-decoration:none;width:6%;transition:width .5s cubic-bezier(.3,.9,.3,1)}
.tr u:after{content:"";position:absolute;right:-5px;top:-4px;width:12px;height:12px;border-radius:50%;
  background:var(--cy);box-shadow:0 0 14px rgba(127,212,255,.8)}
.tm{display:flex;justify-content:space-between;margin-top:9px;font-size:clamp(9px,.86vw,12px);
  color:#8FA3C0;font-variant-numeric:tabular-nums;letter-spacing:.08em}
.ctr{display:flex;align-items:center;gap:clamp(10px,1.3vw,16px);margin-top:clamp(14px,2.6vh,24px)}
.ctr button{width:clamp(34px,3.3vw,42px);aspect-ratio:1;border-radius:50%;
  border:1px solid rgba(233,238,246,.3);background:transparent;color:#E9EEF6;font:inherit;
  font-size:clamp(11px,1vw,14px);cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .2s,color .2s}
.ctr button:hover{background:rgba(233,238,246,.14)}
.ctr button.pl{width:clamp(44px,4.4vw,56px);background:#E9EEF6;color:#0A1120;border-color:#E9EEF6;
  font-size:clamp(13px,1.25vw,16px)}
.ctr button.pl:hover{background:var(--cy);border-color:var(--cy)}
/* 記号は環境で形が変わるので、自前の線で描く */
.ctr svg{width:38%;height:38%;fill:currentColor;display:block}
.ctr button.pl svg{width:40%;height:40%;margin-left:6%}
.ctr button.pl.on svg{margin-left:0}
.msg{margin:10px 0 0;font-size:clamp(9.5px,.86vw,12px);color:#8FA3C0;letter-spacing:.06em;min-height:1.4em}
.ask{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
  background:rgba(10,17,32,.72);padding:24px}
.ask[hidden]{display:none}
.ask div{background:#121C30;border:1px solid rgba(233,238,246,.22);border-radius:12px;
  padding:22px 24px 18px;max-width:22rem;width:100%;box-shadow:0 30px 60px -30px #000}
.ask p{margin:0 0 16px;font-size:clamp(13px,1.1vw,16px);line-height:1.7;letter-spacing:.04em}
.ask .bt{display:flex;gap:10px;justify-content:flex-end}
.ask button{font:inherit;font-size:clamp(12px,1vw,14px);letter-spacing:.06em;cursor:pointer;
  padding:9px 16px;border-radius:999px;border:1px solid rgba(233,238,246,.36);
  background:transparent;color:#E9EEF6}
.ask button.ok{background:#E9EEF6;color:#0A1120;border-color:#E9EEF6;font-weight:700}
.ask button.ok:hover{background:var(--cy);border-color:var(--cy)}
.eqw{display:flex;align-items:flex-end;gap:4px;height:26px;margin-left:10px}
.eqw i{width:4px;background:var(--cy);border-radius:2px;height:6px}
body.playing .eqw i{animation:eq .9s ease-in-out infinite alternate}
@keyframes eq{to{height:24px}}

main{position:relative;z-index:5;flex:1;display:flex;align-items:flex-end;
  padding-block:clamp(14px,3vh,40px)}
/* .on の 6px ずらし分だけ内側に余白を取る（親からはみ出させない） */
.ly{width:min(46vw,600px);max-width:100%;padding-right:8px}
.ly p{margin:0;font-family:"Shippori Mincho B1","Hiragino Mincho ProN",serif;
  font-size:clamp(15px,min(2.1vw,3.4vh),32px);line-height:1.9;letter-spacing:.08em;
  color:rgba(233,238,246,.24);padding-left:16px;border-left:2px solid transparent;
  transition:color .45s ease,border-color .45s ease,transform .45s ease}
.ly p.on{color:#FFFFFF;border-left-color:var(--cy);transform:translateX(6px)}
.links{position:relative;z-index:5;display:flex;flex-wrap:wrap;gap:clamp(12px,1.7vw,22px);
  margin-top:clamp(14px,2.6vh,26px)}
.links a{text-decoration:none;color:#E9EEF6;font-size:clamp(11px,min(1.06vw,1.7vh),16px);
  letter-spacing:.06em;border-bottom:1px solid rgba(233,238,246,.36);padding-bottom:4px}
.links a.on{color:var(--cy);border-bottom-color:rgba(127,212,255,.6)}

@media (max-width:900px){
  .veil{background:
    linear-gradient(180deg,rgba(10,17,32,.92) 0,rgba(10,17,32,.6) 22%,rgba(10,17,32,.28) 40%,
      rgba(10,17,32,.28) 52%,rgba(10,17,32,.8) 74%,rgba(10,17,32,.96) 100%)}
  .por{width:100vw;object-position:50% 20%;
    -webkit-mask-image:linear-gradient(180deg,#000 0,#000 46%,transparent 92%);
    mask-image:linear-gradient(180deg,#000 0,#000 46%,transparent 92%);opacity:0}
  .por.on{opacity:.55}
  .ply,.ly{width:100%}
}
@media (max-height:640px){ .ly p:nth-child(n+3){display:none} }
@media (prefers-reduced-motion:reduce){ .eqw i{animation:none !important} .ly p{transition:none} }
</style>
</head>
<body>
<div class="glow"></div>
<img class="por a on" src="/404/404-17-nowplaying/e22.webp" alt="" fetchpriority="high">
<img class="por b" alt="">
<div class="veil"></div>

<div class="ply">
  <p class="now">NOW PLAYING ／ <b>停止中</b></p>
  <div class="top">
    <img src="/404/404-17-nowplaying/art.webp" alt="">
    <span class="ti">
      <h1 class="tt">404 — Not Found</h1>
      <p class="ta">あなたのブラウザ<br>アルバム『Server Responses, Vol.4』</p>
    </span>
  </div>
  <div class="seek">
    <div class="tr"><u></u></div>
    <div class="tm"><span class="e">0:00</span><span class="r">-:--</span></div>
  </div>
  <div class="ctr">
    <button class="pv" aria-label="前の曲"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 3h3v18H4zM20 3v18L8 12z"/></svg></button>
    <button class="pl" aria-label="再生／一時停止"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="i-play" d="M5 3l16 9-16 9z"/><path class="i-pause" d="M5 3h5v18H5zM14 3h5v18h-5z" style="display:none"/></svg></button>
    <button class="nx" aria-label="次の曲"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 3h3v18h-3zM4 3l12 9-12 9z"/></svg></button>
    <span class="eqw" aria-hidden="true"><i style="animation-delay:0s"></i><i style="animation-delay:.15s"></i><i style="animation-delay:.3s"></i><i style="animation-delay:.05s"></i><i style="animation-delay:.22s"></i><i style="animation-delay:.4s"></i><i style="animation-delay:.12s"></i></span>
  </div>
  <p class="msg" aria-live="polite"></p>
</div>
<audio id="au" preload="none"></audio>
<div class="ask" id="ask" hidden role="dialog" aria-modal="true" aria-labelledby="askp">
  <div>
    <p id="askp">音が鳴ります。再生しますか？</p>
    <div class="bt"><button type="button" class="no">やめておく</button><button type="button" class="ok">再生する</button></div>
  </div>
</div>

<main>
  <div class="ly"><p></p><p></p><p></p><p></p></div>
</main>

<nav class="links">
  <a href="/?from=404-17-nowplaying" class="on">プレイリストへもどる</a>
  <a href="/performances.html?from=404-17-nowplaying">出演情報を見る</a>
</nav>
<script>
(function(){

var P='/404/404-17-nowplaying/';
/* 音源は同じフォルダに 01.mp3 / 02.mp3 / 03.mp3 の名前で置く */
var TRACKS=[
 {t:'404 — Not Found', a:'あなたのブラウザ<br>アルバム『Server Responses, Vol.4』', src:'01.mp3',
  ls:[['No map, no path, no backup, no guide,、','e22'],['404 on the screen, 404 in my mind.','e3'],['But the harder they hide it, the harder I grind—','e7'],['If I can’t find the way, I’ll design the design.','e20']]},
 {t:'Lost &amp; Found', a:'終電の窓<br>シングル『4:04』', src:'02.mp3',
  ls:[['404　404　世界がNot Found','e9'],['404　404　声だけRebound','e6'],['「存在しない」なら　存在を描け','e8'],['404の画面から　明日を書き換え','e21']]},
 {t:'Reload', a:'屋上の風<br>アルバム『Reload』', src:'03.mp3',
  ls:[['更新しても　更新しても　白いまま','e21'],['アドレスは合ってる　でも誰もいない','e9'],['探しものは　いつも探した後に','e6'],['見つからないなら　ここから始めよう','e20']]}];

/* 切り替え用の絵は、初回描画のあと裏で先読みしておく（押した瞬間に待たせない） */
setTimeout(function(){
  TRACKS.forEach(function(T){ T.ls.forEach(function(l){ var i=new Image(); i.src=P+l[1]+'.webp'; }); });
},400);

var ps=[].slice.call(document.querySelectorAll('.ly p')),
    tt=document.querySelector('.tt'), ta=document.querySelector('.ta'),
    fill=document.querySelector('.tr u'),
    el=document.querySelector('.tm .e'), rl=document.querySelector('.tm .r'),
    st=document.querySelector('.now b'), msg=document.querySelector('.msg'),
    bpl=document.querySelector('.pl'), bnx=document.querySelector('.nx'), bpv=document.querySelector('.pv'),
    ipl=bpl.querySelector('.i-play'), ipa=bpl.querySelector('.i-pause'),
    pa=document.querySelector('.por.a'), pb=document.querySelector('.por.b'),
    au=document.getElementById('au'), ask=document.getElementById('ask');
var ti=0, li=0, playing=false, iv=null, asked=false;

function swap(key){
  var src=P+key+'.webp';
  var show=pa.classList.contains('on')?pb:pa, hide=pa.classList.contains('on')?pa:pb;
  if(hide.getAttribute('src')===src) return;
  function go(){ show.classList.add('on'); hide.classList.remove('on'); }
  if(show.getAttribute('src')===src){ go(); return; }
  show.src=src;
  if(show.complete && show.naturalWidth) go(); else show.onload=go;
}
function mmss(x){ x=Math.max(0,Math.round(x)); return Math.floor(x/60)+':'+('0'+x%60).slice(-2); }
function clock(){
  var d=au.duration, c=au.currentTime||0;
  if(d&&isFinite(d)){ fill.style.width=(c/d*100).toFixed(2)+'%'; el.textContent=mmss(c); rl.textContent='-'+mmss(d-c); }
  else{ fill.style.width='0%'; el.textContent='0:00'; rl.textContent='-:--'; }
}
function paint(){
  var T=TRACKS[ti];
  tt.innerHTML=T.t; ta.innerHTML=T.a;
  ps.forEach(function(p,i){ p.textContent=T.ls[i]?T.ls[i][0]:''; p.classList.toggle('on',i===li); });
  swap(T.ls[li][1]);
}
function ui(){
  ipl.style.display=playing?'none':''; ipa.style.display=playing?'':'none';
  bpl.classList.toggle('on',playing);
  st.textContent=playing?'再生中':'停止中';
}
/* 歌詞と絵は、音が鳴っていてもいなくても勝手に送り続ける（再生ボタンは音だけ） */
document.body.classList.add('playing');
function run(){ clearInterval(iv); iv=setInterval(function(){
  li=(li+1)%TRACKS[ti].ls.length; paint(); },3400); }

function load(){
  var want=P+TRACKS[ti].src;
  if(au.getAttribute('src')!==want){ au.setAttribute('src',want); au.load(); }
  msg.textContent=''; clock();
}
function play(){
  load();
  var p=au.play();
  if(p&&p.then) p.catch(function(){ /* 失敗の中身は error / pause の側で拾う */ });
}
function stop(){ playing=false; ui(); }

au.addEventListener('play',function(){ playing=true; ui(); });
au.addEventListener('pause',function(){ if(!au.ended) stop(); });
au.addEventListener('ended',function(){ stop(); au.currentTime=0; clock(); });
au.addEventListener('timeupdate',clock);
au.addEventListener('loadedmetadata',clock);
au.addEventListener('error',function(){
  stop();
  msg.textContent='音源が見つかりません（'+TRACKS[ti].src+'）。絵と歌詞だけお楽しみください。';
});

bpl.addEventListener('click',function(){
  if(playing){ au.pause(); return; }
  if(!asked){ ask.hidden=false; ask.querySelector('.ok').focus(); return; }
  play();
});
ask.querySelector('.ok').addEventListener('click',function(){ asked=true; ask.hidden=true; play(); });
ask.querySelector('.no').addEventListener('click',function(){ ask.hidden=true; });
ask.addEventListener('click',function(e){ if(e.target===ask) ask.hidden=true; });
document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&!ask.hidden) ask.hidden=true; });

function go(d){
  var was=playing;
  au.pause(); ti=(ti+d+TRACKS.length)%TRACKS.length; li=0; paint(); run();
  if(was) play(); else { au.removeAttribute('src'); au.load(); msg.textContent=''; clock(); }
}
bnx.addEventListener('click',function(){ go(1); });
bpv.addEventListener('click',function(){ go(-1); });

paint(); run(); ui(); clock();
})();
</script>
</body>
</html>
