<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>404 ｜ エラー</title>
<!-- 外部読み込みなし（フォント・CSS・JS はすべてこのファイル内）。
     Shippori Mincho を使いたい場合のみ、次の一行のコメントを外してください。
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;600&display=swap"> -->
<style>
/* ───────── 基準寸法：幅と高さの両方から決める ───────── */
html{
  font-size:clamp(12px, min(0.95vw, 1.55vh), 17px);
  -webkit-text-size-adjust:100%;
}
:root{
  --paper:#F3F3F1;
  --ground:#E7E7E3;
  --ink:#15161A;
  --ink2:#5B5F66;
  --hair:#DCDCD8;
  --shu:#B0492C;
  --mincho:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP",serif;
  --gothic:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",YuGothic,"Noto Sans JP",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--ground);
  color:var(--ink);
  font-family:var(--gothic);
  height:100vh;          /* 高さを確定させる（画像の伸びを止める） */
  height:100svh;
  display:grid;
  place-items:center;
  padding:clamp(0.5rem, 1.6vmin, 1.8rem);
  overflow:hidden;
}
img{max-width:100%;display:block}

/* ───────── 用紙 ───────── */
.sheet{
  width:min(100%, 110rem);
  height:100%;
  max-height:min(100%, 62rem);
  background:var(--paper);
  border:1px solid var(--hair);
  padding:clamp(1rem, 2.2vmin, 2.2rem) clamp(1.1rem, 2.6vmin, 2.6rem) clamp(0.9rem, 2vmin, 2rem);
  display:flex;
  flex-direction:column;
  min-height:0;
  overflow:hidden;
}

/* ───────── 見出し ───────── */
.top{
  display:flex;align-items:baseline;justify-content:space-between;gap:1rem;
  border-bottom:1px solid var(--ink);padding-bottom:.7rem;flex:none;
}
.brand{font-family:var(--mincho);font-size:1.55rem;letter-spacing:.3em;font-weight:600;white-space:nowrap}
.brand span{font-family:var(--mono);font-size:.78rem;letter-spacing:.24em;color:var(--ink2);margin-inline-start:1.2rem}
.count{font-family:var(--mono);font-size:.82rem;letter-spacing:.14em;color:var(--ink2);white-space:nowrap}

/* ───────── 本体 ───────── */
.grid{
  flex:1;min-height:0;display:grid;
  grid-template-columns:minmax(0,1fr) minmax(21rem,31rem);
  grid-template-rows:minmax(0,1fr);
  gap:clamp(1.2rem,3vmin,3rem);
  padding-top:clamp(.9rem,2.2vmin,1.8rem);
}

/* 見本（写真＋色面）— 比率は画面によらず一定に */
.specimen{display:flex;min-height:0}
.plate{
  display:flex;flex-direction:column;min-height:0;height:100%;
  aspect-ratio:5/6;width:auto;max-width:100%;margin-inline:auto;
}
.field{
  position:relative;flex:1;min-height:6rem;overflow:hidden;
  background:var(--c,#E6E5E1);transition:background .35s ease;
}
.field img{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:56% 24%;
  mix-blend-mode:luminosity;opacity:var(--o,.95);transition:opacity .35s ease;
}
.hatch{
  position:absolute;inset:0;opacity:var(--h,1);transition:opacity .35s ease;
  background:repeating-linear-gradient(-45deg,transparent 0 .75rem,rgba(21,22,26,.055) .75rem 1.5rem);
}
.cap{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;padding-top:.75rem;flex:none}
.cap b{font-family:var(--mincho);font-size:1.5rem;letter-spacing:.14em;font-weight:600}
.cap span{font-family:var(--mono);font-size:.86rem;letter-spacing:.14em;color:var(--ink2)}

/* 右段 */
.aside{display:flex;flex-direction:column;min-width:0;min-height:0}
h1{
  font-family:var(--mincho);font-size:2.3rem;font-weight:600;line-height:1.6;letter-spacing:.04em;
  margin:0 0 .7rem;text-wrap:balance;
}
h1 em{font-style:normal;color:var(--shu)}
.lead{font-size:1.02rem;line-height:1.95;color:var(--ink2);margin:0 0 1.3rem;max-width:34em}

.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:.85rem}
.chip{appearance:none;border:0;background:transparent;padding:0;cursor:pointer;text-align:start;font:inherit;color:inherit}
.chip i{display:block;height:3.6rem;background:var(--cc);box-shadow:inset 0 0 0 1px rgba(21,22,26,.1);transition:box-shadow .15s}
.chip b{display:block;font-family:var(--mono);font-size:.8rem;letter-spacing:.1em;color:var(--ink2);margin-top:.5rem;font-weight:400}
.chip em{display:block;font-style:normal;font-size:.92rem;letter-spacing:.06em;margin-top:.15rem}
.chip:hover i{box-shadow:inset 0 0 0 1px rgba(21,22,26,.1),0 .25rem .8rem rgba(21,22,26,.18)}
.chip[aria-pressed="true"] i{box-shadow:inset 0 0 0 2px var(--ink)}
.chip.void i{
  background:var(--paper);box-shadow:inset 0 0 0 1px #B9B7B0;
  background-image:linear-gradient(-45deg,transparent 48%,var(--shu) 48%,var(--shu) 52%,transparent 52%);
}
.chip.void[aria-pressed="true"] i{box-shadow:inset 0 0 0 2px var(--shu)}
.chip.void em{color:var(--shu)}
.chip:focus-visible{outline:2px solid var(--shu);outline-offset:.25rem}

.spec{
  margin:clamp(1rem,2.4vmin,1.6rem) 0 0;display:grid;grid-template-columns:auto 1fr;gap:.5rem 1.6rem;
  font-size:.92rem;border-top:1px solid var(--hair);padding-top:1rem;
}
.spec dt{color:var(--ink2);letter-spacing:.14em}
.spec dd{margin:0;font-family:var(--mono);letter-spacing:.02em;font-variant-numeric:tabular-nums}

.foot{
  margin-top:auto;padding-top:1rem;display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;
  border-top:1px solid var(--hair);font-size:.86rem;color:var(--ink2);letter-spacing:.1em;
}
.foot a{
  font-family:var(--mincho);font-size:1.05rem;letter-spacing:.16em;color:var(--ink);text-decoration:none;
  border-bottom:1px solid var(--ink);padding-bottom:.2rem;white-space:nowrap;
}
.foot a:hover,.foot a:focus-visible{color:var(--shu);border-color:var(--shu)}

/* ───────── 縦長・小画面：一列に ───────── */
@media (max-width:900px),(orientation:portrait) and (max-width:1100px){
  .grid{
    grid-template-columns:minmax(0,1fr);
    grid-template-rows:auto minmax(0,1fr);
    gap:clamp(1rem,2.4vmin,1.6rem);
  }
  /* 縦一列では一画面に収まらないので、用紙ごと縦に伸ばして普通にスクロールさせる */
  body{height:auto;min-height:100svh;overflow:auto;place-items:start center}
  .sheet{height:auto;max-height:none;overflow:visible}
  .grid{grid-template-rows:auto auto}
  .plate{aspect-ratio:auto;height:auto;width:100%}
  /* 見本の高さも幅と高さの両方から決める */
  .field{flex:none;min-height:0;height:clamp(8rem, min(42vw, 30vh), 22rem)}
  .specimen{min-height:0}
  .aside{min-height:0}
  h1{font-size:2.05rem}
  .lead{margin-bottom:1rem}
  .brand span{display:none}
  .foot{margin-top:1rem}
}
@media (max-width:560px){
  .chips{gap:.6rem}
  .chip i{height:2.6rem}
  .spec{grid-template-columns:auto 1fr;gap:.35rem 1rem;font-size:.86rem;padding-top:.8rem;margin-top:.8rem}
  .cap b{font-size:1.3rem}
  h1{font-size:1.9rem;line-height:1.55}
  .foot{flex-direction:row;align-items:center;font-size:.78rem}
}
/* 低い横長 */
@media (min-width:901px) and (max-height:700px){
  .chip i{height:2.8rem}
  h1{font-size:2rem}
  .spec{gap:.35rem 1.4rem}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.001ms!important;animation-duration:.001ms!important}}
</style>
</head>
<body>
<main class="sheet">
  <div class="top">
    <div class="brand">色見本帳<span>STANDARD COLOURS 2026</span></div>
    <div class="count">全 32 色／うち 1 色 廃番</div>
  </div>

  <div class="grid">
    <section class="specimen">
     <div class="plate">
      <div class="field" id="field">
        <!-- 画像は絶対パス。差し替える場合もこの形式で -->
        <img src="/404/404-26-haiban/specimen.webp" alt="色見本の刷り出し" width="960" height="1080" decoding="async">
        <span class="hatch"></span>
      </div>
      <div class="cap"><b id="nm">廃番</b><span id="code">No. 404</span></div>
     </div>
    </section>

    <section class="aside">
      <h1>色番号 <em>404</em> は<br>廃番になりました。</h1>
      <p class="lead">見本帳から外された色です。刷り出しの見本も残っていません。近い色を下から選び直してください。</p>
      <div class="chips" id="chips"></div>
      <dl class="spec" id="spec"></dl>
      <div class="foot">
        <span>色見本帳　第三版　／　2026</span>
        <!-- リンク先はサイトに合わせて変更してください -->
        <a href="/">色の一覧へ戻る</a>
      </div>
    </section>
  </div>
</main>

<script>
(function(){
  var C=[
    {c:'201',n:'鉄紺',h:'#2B3A5B',r:'43 58 91',k:'88 / 72 / 38 / 26',y:'1904'},
    {c:'202',n:'白群',h:'#83B3C9',r:'131 179 201',k:'50 / 16 / 16 / 0',y:'1911'},
    {c:'203',n:'藤',  h:'#A59ACA',r:'165 154 202',k:'38 / 40 / 0 / 0',y:'1898'},
    {c:'204',n:'灰桜',h:'#E0C8C6',r:'224 200 198',k:'6 / 22 / 15 / 0',y:'1923'},
    {c:'205',n:'若苗',h:'#A9C084',r:'169 192 132',k:'38 / 12 / 55 / 0',y:'1906'},
    {c:'206',n:'洗朱',h:'#D07049',r:'208 112 73',k:'12 / 68 / 74 / 0',y:'1889'},
    {c:'207',n:'象牙',h:'#EDE4D3',r:'237 228 211',k:'6 / 8 / 18 / 0',y:'1930'},
    {c:'208',n:'墨',  h:'#33322E',r:'51 50 46',k:'0 / 0 / 0 / 92',y:'1872'},
    {c:'404',n:'-',  h:null,     r:'4 0 4',k:'Page/Not/Found',y:'1992?',dead:true}
  ];
  var chips=document.getElementById('chips'),field=document.getElementById('field'),
      nm=document.getElementById('nm'),code=document.getElementById('code'),spec=document.getElementById('spec');
  if(!chips||!field||!spec){return;}

  chips.innerHTML=C.map(function(x){
    return '<button type="button" class="chip'+(x.dead?' void':'')+'" data-c="'+x.c+'" aria-pressed="false"'+
      (x.h?' style="--cc:'+x.h+'"':'')+'><i></i><b>No. '+x.c+'</b><em>'+x.n+'</em></button>';
  }).join('');

  function pick(cn){
    var x=null;
    for(var i=0;i<C.length;i++){ if(C[i].c===cn){x=C[i];break;} }
    if(!x){return;}
    var bs=chips.querySelectorAll('.chip');
    for(var j=0;j<bs.length;j++){ bs[j].setAttribute('aria-pressed', String(bs[j].getAttribute('data-c')===cn)); }
    if(x.dead){
      field.style.setProperty('--c','#E6E5E1');
      field.style.setProperty('--o','.28');
      field.style.setProperty('--h','1');
      nm.textContent='廃番';
    }else{
      field.style.setProperty('--c',x.h);
      field.style.setProperty('--o','.95');
      field.style.setProperty('--h','0');
      nm.textContent=x.n;
    }
    code.textContent='No. '+x.c;
    spec.innerHTML=
      '<dt>和名</dt><dd>'+(x.dead?'ページが見つかりません':x.n)+'</dd>'+
      '<dt>RGB</dt><dd>'+x.r+'</dd>'+
      '<dt>CMYK</dt><dd>'+x.k+'</dd>'+
      '<dt>初出</dt><dd>'+x.y+'</dd>'+
      '<dt>備考</dt><dd>'+(x.dead?'202X年に製造終了':'在庫あり')+'</dd>';
  }

  chips.addEventListener('click',function(e){
    var b=e.target.closest ? e.target.closest('.chip') : null;
    if(b){ pick(b.getAttribute('data-c')); }
  });

  pick('404');
})();
</script>
</body>
</html>
