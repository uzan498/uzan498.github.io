<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>404 ｜ お探しのページは存在しません</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=IBM+Plex+Mono:wght@400;600&family=Shippori+Mincho+B1:wght@400;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overflow-x:clip}
html,body{margin:0;padding:0}
img{width:auto;height:auto;max-width:100%;display:block}
a{color:inherit}

:root{
  --pad:clamp(18px,4vw,80px);
  --bg:#08080C;
  --fg:#E8E8F0;
  --cy:#00F0FF;
  --mg:#FF2E63;
}
body{
  min-height:100svh;display:flex;flex-direction:column;
  padding:var(--pad);gap:clamp(10px,2svh,24px);
  overflow-x:hidden;background:var(--bg);color:var(--fg);
  font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  -webkit-font-smoothing:antialiased;
}
.cv{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
.scan{position:fixed;inset:0;pointer-events:none;z-index:1;
  background:repeating-linear-gradient(0deg,rgba(232,232,240,.055) 0 1px,transparent 1px 3px)}
.bandline{position:fixed;left:0;width:100%;height:126px;pointer-events:none;z-index:1;
  background:linear-gradient(180deg,transparent,rgba(0,240,255,.11) 46%,transparent);
  animation:band 5.6s linear infinite}
@keyframes band{0%{top:-140px}100%{top:102svh}}

.head,.main,.foot{position:relative;z-index:2}
.head{flex:0 0 auto;display:flex;justify-content:flex-end}
.tag{font-size:clamp(9px,.92vw,11px);letter-spacing:.2em;text-align:right;line-height:2;
  color:#8A8FA0;border-right:2px solid var(--mg);padding-right:14px}

.main{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:center;
  gap:clamp(6px,1.2svh,14px);max-width:min(100%,62ch)}
.num{font-family:"Archivo",Impact,sans-serif;font-size:clamp(64px,min(14vw,22svh),190px);
  font-weight:800;letter-spacing:-.045em;line-height:1;
  animation:shift 3.4s steps(1) infinite}
@keyframes shift{0%,88%{text-shadow:none;translate:0}
  90%{text-shadow:-7px 0 var(--mg),7px 0 var(--cy);translate:5px}
  93%{text-shadow:6px 0 var(--mg),-6px 0 var(--cy);translate:-4px}
  96%,100%{text-shadow:none;translate:0}}
.sub{font-size:clamp(11px,1.2vw,15px);letter-spacing:.24em;color:var(--cy);
  min-height:1.4em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ja{font-family:"Shippori Mincho B1",serif;font-size:clamp(14px,min(1.55vw,2.5svh),19px);
  letter-spacing:.1em;margin-top:6px}
.hex{font-size:clamp(9.5px,.95vw,11.5px);line-height:1.9;color:#5C6070;letter-spacing:.06em;
  margin-top:clamp(6px,1.6svh,20px);white-space:nowrap;overflow:hidden}

.foot{flex:0 0 auto;display:flex;flex-wrap:wrap;align-items:center;
  justify-content:space-between;gap:12px 18px}
.link{font-size:clamp(10px,1.05vw,12px);letter-spacing:.2em;color:var(--bg);
  background:var(--cy);padding:9px 18px;text-decoration:none;white-space:nowrap}
.link:hover{background:#7CF7FF}
.err{background:var(--mg);color:var(--bg);padding:6px 14px;
  font-size:clamp(10px,1.05vw,12px);letter-spacing:.16em;white-space:nowrap;
  animation:blink 2.4s steps(1) infinite}
@keyframes blink{0%,78%{opacity:1}80%,86%{opacity:.15}88%,100%{opacity:1}}

@media (max-width:560px){ .hex{white-space:normal} }
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important}
}
</style>
</head>
<body>

<canvas class="cv" aria-hidden="true"></canvas>
<div class="scan" aria-hidden="true"></div>
<div class="bandline" aria-hidden="true"></div>

<header class="head">
  <div class="tag">CH 04<br>DECODE FAIL<br>404 / NULL</div>
</header>

<main class="main">
  <div class="num">404</div>
  <div class="sub" id="sub" data-t="SIGNAL LOST / NO SUCH PAGE">SIGNAL LOST / NO SUCH PAGE</div>
  <div class="ja">お探しのページは存在しません。</div>
  <div class="hex">0x00404 &nbsp;FF D8 FF E0 00 10 4A 46 49 46<br>0x00414 &nbsp;-- -- -- -- ?? ?? ?? ?? ?? ??<br>0x00424 &nbsp;read error — offset out of range</div>
</main>

<footer class="foot">
  <a class="link" href="/?from=404-33-glitch">RESTORE INDEX →</a>
  <div class="err">DATA NOT FOUND</div>
</footer>

<script>
(function(){
  var cv=document.querySelector('.cv'), ctx=cv.getContext('2d');
  var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  var W=1,H=1,DPR=1, base=null,red=null,cyan=null, ready=false;

  var im=new Image();
  im.onload=function(){ ready=true; build(); if(reduce) draw(0); else loop(); };
  im.src='/404/404-33-glitch/bob.webp';

  /* 三枚の版（素／赤／シアン）を画面の大きさで焼き直す */
  function build(){
    if(!ready||!W||!H) return;
    var h=H*0.95, w=im.width*(h/im.height);
    if(w>W*0.86){ w=W*0.86; h=im.height*(w/im.width); }
    var x=(W-w)/2+W*0.14, y=H-h+H*0.04;
    function mk(color){
      var c=document.createElement('canvas'); c.width=W; c.height=H;
      var g=c.getContext('2d');
      g.drawImage(im,x,y,w,h);
      if(color){
        g.globalCompositeOperation='multiply'; g.fillStyle=color; g.fillRect(0,0,W,H);
        g.globalCompositeOperation='destination-in'; g.drawImage(im,x,y,w,h);
      }
      return c;
    }
    base=mk(null); red=mk('#FF2E63'); cyan=mk('#00F0FF');
  }
  function size(){
    DPR=Math.min(window.devicePixelRatio||1,1.5);
    W=Math.max(1,Math.round(cv.clientWidth)); H=Math.max(1,Math.round(cv.clientHeight));
    cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
    build();
  }
  function draw(t){
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.fillStyle='#08080C'; ctx.fillRect(0,0,W,H);
    if(!base) return;
    var wob=Math.sin(t*0.0012)*4;
    ctx.globalCompositeOperation='lighter';
    ctx.globalAlpha=.85; ctx.drawImage(cyan,-6-wob,0); ctx.drawImage(red,6+wob,0);
    ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
    ctx.globalAlpha=.9; ctx.drawImage(base,0,0); ctx.globalAlpha=1;
    var burst=(Math.sin(t*0.0009)>0.92)||Math.random()<0.05;
    var n=burst?14:4;
    ctx.setTransform(1,0,0,1,0,0);                 /* スライスは実画素で切る */
    for(var i=0;i<n;i++){
      var sy=Math.random()*cv.height, sh=(6+Math.random()*46)*DPR;
      var dx=(Math.random()-.5)*(burst?190:56)*DPR;
      ctx.drawImage(cv,0,sy,cv.width,sh,dx,sy,cv.width,sh);
      if(Math.random()<.3){
        ctx.fillStyle=Math.random()<.5?'rgba(255,46,99,.5)':'rgba(0,240,255,.42)';
        ctx.fillRect(dx,sy,cv.width,2*DPR);
      }
    }
    if(burst){
      ctx.fillStyle='rgba(232,232,240,.09)';
      ctx.fillRect(0,Math.random()*cv.height,cv.width,(2+Math.random()*8)*DPR);
    }
  }
  function loop(ts){ draw(ts||0); requestAnimationFrame(loop); }
  window.addEventListener('resize',size);
  size();

  /* 文字のスクランブル */
  var el=document.getElementById('sub');
  if(el&&!reduce){
    var target=el.dataset.t, chars='!<>-_\\/[]{}=+*^?#01_';
    setInterval(function(){
      var out='';
      for(var i=0;i<target.length;i++){
        var ch=target[i];
        out += (ch===' '||Math.random()>0.22) ? ch : chars[(Math.random()*chars.length)|0];
      }
      el.textContent=out;
      setTimeout(function(){ el.textContent=target; },260);
    },2600);
  }
})();
</script>
</body>
</html>
