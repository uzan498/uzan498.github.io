<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>404 ページが見つかりません ｜ 該当なし</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;800&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
/* width/height 属性は CSS の width/height に効いてしまう（presentational hint）。
   幅だけ指定した画像が属性の高さで固まるので、ここで無効化しておく */
img{max-width:none;width:auto;height:auto}
a{color:inherit}
:focus-visible{outline-offset:3px}

:root{
  --pad:clamp(16px,4.4vw,60px);
  --vb:min(8.3vw,13.2vh);     /* 縦組みの大きい字 */
  --vs:min(1.5vw,2.4vh);      /* 縦組みの小さい字 */
  --ink:#18222E; --paper:#F2F0E9; --red:#C0392B;
}
html{background:var(--paper);height:100svh;overflow:hidden}
body{position:relative;height:100svh;overflow:hidden;background:var(--paper);color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}

.rules i{position:absolute;top:0;bottom:0;width:1px;background:rgba(24,34,46,.14);
  transform:scaleY(0);transform-origin:top;animation:ln 1.15s cubic-bezier(.2,.9,.2,1) forwards;z-index:1}
@keyframes ln{to{transform:scaleY(1)}}
.rules i:nth-child(1){left:11%;animation-delay:.05s}
.rules i:nth-child(2){left:41%;animation-delay:.14s}
.rules i:nth-child(3){left:66%;animation-delay:.23s}
.rules i:nth-child(4){left:88%;animation-delay:.32s}

/* 単色の帯写真。ごくゆっくり流れる */
.strip{position:absolute;left:15.3%;top:0;height:100svh;width:min(24.8vw,39.7vh);
  min-width:150px;overflow:hidden;background:var(--ink);opacity:0;z-index:2;
  animation:st 1.3s cubic-bezier(.2,.9,.2,1) .3s forwards}
@keyframes st{from{opacity:0;clip-path:inset(0 0 100% 0)}to{opacity:1;clip-path:inset(0 0 0 0)}}
.strip img{position:absolute;left:0;top:-13%;width:100%;height:126%;object-fit:cover;
  object-position:50% 22%;animation:dr 38s ease-in-out infinite alternate}
@keyframes dr{to{transform:translateY(-7.5%)}}

.kick{position:absolute;left:var(--pad);top:clamp(40px,7.75vh,62px);margin:0;z-index:4;
  writing-mode:vertical-rl;font-size:clamp(9px,.82vw,12px);letter-spacing:.32em;color:#7C8797;
  opacity:0;animation:up .8s ease .5s forwards}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.no{position:absolute;left:var(--pad);bottom:clamp(40px,9.75vh,78px);margin:0;z-index:4;
  font-size:clamp(12px,1.2vw,17px);letter-spacing:.42em;color:var(--ink);
  font-variant-numeric:tabular-nums;opacity:0;animation:up .8s ease .62s forwards}
.no em{font-style:normal;color:var(--red)}

.vt{position:absolute;z-index:4;font-family:"Shippori Mincho B1","Noto Serif JP",serif}
.vt span{display:block;text-align:center;opacity:0;
  animation:ch .7s cubic-bezier(.2,.9,.2,1) forwards}
@keyframes ch{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:none}}
.vt span:nth-child(1){animation-delay:.72s}   .vt span:nth-child(2){animation-delay:.83s}
.vt span:nth-child(3){animation-delay:.94s}   .vt span:nth-child(4){animation-delay:1.05s}
.vt span:nth-child(5){animation-delay:1.16s}  .vt span:nth-child(6){animation-delay:1.27s}
.vt span:nth-child(7){animation-delay:1.38s}  .vt span:nth-child(8){animation-delay:1.49s}
.vt span:nth-child(9){animation-delay:1.6s}   .vt span:nth-child(10){animation-delay:1.71s}
.vt span:nth-child(11){animation-delay:1.82s} .vt span:nth-child(12){animation-delay:1.93s}
.vt span:nth-child(13){animation-delay:2.04s}
.vt.big{left:44.2%;top:14%;font-weight:800;color:var(--ink)}
.vt.big span{width:calc(var(--vb) * 1.12);height:calc(var(--vb) * 1.25);
  line-height:calc(var(--vb) * 1.25);font-size:var(--vb)}
.vt.sm{left:58%;top:18.75%;font-weight:400;color:#5B6675}
.vt.sm span{width:calc(var(--vs) * 1.26);height:calc(var(--vs) * 1.68);
  line-height:calc(var(--vs) * 1.68);font-size:var(--vs)}
/* 句読点はその span だけ縦書きにして、フォントの縦組み字形（右上に付く）を使う。
   縦書きでは line-height が横幅・text-align が縦位置になるので、幅に合わせて上寄せする。
   transform でずらす方法は、出現アニメーションの transform:none に上書きされて効かない */
.vt span.p{writing-mode:vertical-rl;text-orientation:mixed;text-align:start}
.vt.big span.p{line-height:calc(var(--vb) * 1.12)}
.vt.sm span.p{line-height:calc(var(--vs) * 1.26)}
.dot{position:absolute;left:44.4%;top:83.5%;width:clamp(8px,1vw,14px);aspect-ratio:1;
  background:var(--red);opacity:0;z-index:4;animation:up .7s ease 2.1s forwards}

.links{position:absolute;right:var(--pad);bottom:clamp(48px,9.25vh,74px);z-index:4;
  display:flex;flex-direction:column;align-items:flex-end;gap:clamp(9px,1.7vh,15px);
  opacity:0;animation:up .8s ease 2.2s forwards}
.links a{text-decoration:none;color:var(--ink);font-size:clamp(11px,min(1.1vw,1.8vh),16px);
  letter-spacing:.12em;border-bottom:1px solid rgba(24,34,46,.28);padding-bottom:5px}
.links a.on{border-bottom-color:var(--red)}
.links a:hover{border-bottom-color:var(--ink)}
.rule{position:absolute;right:var(--pad);bottom:clamp(28px,6.5vh,52px);
  width:min(19vw,196px);height:1px;background:rgba(24,34,46,.2);z-index:4;
  opacity:0;animation:up .8s ease 2.3s forwards}

@media (max-width:820px){
  :root{ --vb:min(15vw,10vh); --vs:min(3.1vw,2.1vh); }
  .rules i:nth-child(3),.rules i:nth-child(4){display:none}
  .strip{left:auto;right:-4%;top:0;width:min(46vw,50vh)}
  .vt.big{left:var(--pad);top:16%}
  .vt.sm{left:calc(var(--pad) + var(--vb) * 1.9);top:20%}
  .dot{left:calc(var(--pad) + var(--vb) * .5);top:auto;bottom:26%}
  .links{right:auto;left:var(--pad);align-items:flex-start;bottom:clamp(46px,10vh,80px)}
  .rule{right:auto;left:var(--pad);width:min(44vw,220px)}
  .no{bottom:clamp(24px,5vh,48px)}
}
@media (prefers-reduced-motion:reduce){
  .rules i,.strip,.kick,.no,.vt span,.dot,.links,.rule{animation-duration:.01ms;animation-delay:0s;
    opacity:1;transform:none}
  .strip img{animation:none}
}
</style>
</head>
<body>
<div class="rules" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div class="strip"><img src="/404/404-12-yohaku/strip.webp" alt=""></div>

<p class="kick">ERROR 404 ／ NO SUCH PAGE</p>

<h1 class="vt big" data-vt="該当なし"></h1>
<div class="vt sm" data-vt="お探しの頁は、ございません。"></div>
<span class="dot" aria-hidden="true"></span>

<p class="no">4 0 <em>4</em></p>

<nav class="links">
  <a class="on" href="/?from=404-12-yohaku">はじめにもどる</a>
  <a href="/performances.html?from=404-12-yohaku">出演情報を見る</a>
  <a href="/index.html#contact?from=404-12-yohaku">お問い合わせ</a>
</nav>
<span class="rule" aria-hidden="true"></span>
<script>
(function(){

var vts=document.querySelectorAll('[data-vt]');
for(var i=0;i<vts.length;i++){
  var el=vts[i], t=el.getAttribute('data-vt'); el.textContent='';
  for(var j=0;j<t.length;j++){
    var sp=document.createElement('span'); sp.textContent=t[j];
    if('、。，．'.indexOf(t[j])>=0) sp.className='p';
    el.appendChild(sp);
  }
}
})();
</script>
</body>
</html>
