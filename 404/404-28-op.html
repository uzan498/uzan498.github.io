<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>404 ｜ 見えているものが、あるとは限らない</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=IBM+Plex+Mono:wght@400;600&family=Shippori+Mincho+B1:wght@400;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overflow-x:clip}
html,body{margin:0;padding:0}
img{width:auto;height:auto;max-width:100%;display:block}
a{color:inherit}

:root{
  --pad:clamp(14px,2.8vw,46px);
  --ink:#0D0D0D;
  --paper:#F2F1EC;
  --red:#D93A1F;
}
body{
  min-height:100svh;
  display:flex;flex-direction:column;
  padding:var(--pad);
  gap:12px;
  overflow-x:hidden;
  background:var(--paper);
  color:var(--ink);
  font-family:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
/* 波の版そのもの。装飾なので後ろに固定する */
.bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}

.head,.foot{position:relative;z-index:1;flex:0 0 auto;
  display:flex;flex-wrap:wrap;gap:10px 16px}
.head{align-items:flex-start;justify-content:space-between}
.foot{align-items:flex-end;justify-content:space-between}
main{flex:1 1 auto;min-height:clamp(120px,26svh,320px)}

.link{
  font-size:clamp(10px,1.05vw,13px);letter-spacing:.24em;font-weight:800;
  text-decoration:none;background:var(--paper);padding:8px 14px;border:1px solid var(--ink);
}
.link:hover{background:var(--ink);color:var(--paper)}
.tag{
  font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:clamp(9px,.95vw,12px);letter-spacing:.14em;text-align:right;line-height:2;
  background:var(--paper);padding:6px 11px;border:1px solid var(--ink);
}

.plate{
  position:relative;min-width:0;max-width:min(100%,62ch);
  background:var(--ink);color:var(--paper);
  padding:clamp(16px,2.4vw,34px) clamp(18px,2.8vw,46px) clamp(14px,2vw,30px) clamp(26px,3.4vw,60px);
}
.plate::before{content:"";position:absolute;left:0;top:0;bottom:0;
  width:clamp(8px,1vw,14px);background:var(--red)}
.plate h1{
  margin:0;font-weight:800;font-size:clamp(52px,min(11vw,17svh),128px);
  line-height:.86;letter-spacing:-.045em;
}
.plate p{margin:12px 0 0;font-size:clamp(10px,1.05vw,14px);
  letter-spacing:.2em;font-weight:600;text-transform:uppercase;color:#B9B7AF}
.plate .ja{font-family:"Shippori Mincho B1",serif;
  font-size:clamp(13px,min(1.5vw,2.4svh),17px);letter-spacing:.1em;
  text-transform:none;color:var(--paper);margin-top:9px}

.hint{
  display:flex;align-items:center;gap:10px;flex:0 0 auto;
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:clamp(9px,.95vw,12px);letter-spacing:.16em;
  background:var(--paper);padding:6px 11px;
}
.hint i{width:22px;height:22px;border:1px solid var(--ink);border-radius:50%;display:block;
  flex:0 0 auto;animation:opulse 2.6s ease-in-out infinite}
@keyframes opulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.5);opacity:.25}}

@media (max-width:640px){
  .foot{flex-direction:column;align-items:stretch}
  .plate{max-width:100%}
  .hint{align-self:flex-start}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important}
}
</style>
</head>
<body>

<canvas class="bg" aria-hidden="true"></canvas>

<header class="head">
  <a class="link" href="/?from=404-28-op">← INDEX</a>
  <div class="tag">ERR 404<br>NOT FOUND<br>N=84 LINES</div>
</header>

<main></main>

<footer class="foot">
  <div class="plate">
    <h1>404</h1>
    <p>the page is not there. keep looking.</p>
    <p class="ja">見えているものが、あるとは限らない。</p>
  </div>
  <div class="hint"><i></i><span class="hint-t">MOVE THE CURSOR</span></div>
</footer>

<script>
(function(){
  var cv=document.querySelector('.bg'), ctx=cv.getContext('2d');
  var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  var touch=!matchMedia('(hover:hover)').matches;
  if(touch){ var ht=document.querySelector('.hint-t'); if(ht) ht.textContent='DRAG ACROSS'; }

  var W=1,H=1,DPR=1;
  var OW=290,OH=236, lum=null;
  var off=document.createElement('canvas'); off.width=OW; off.height=OH;
  var octx=off.getContext('2d');

  var im=new Image();
  im.onload=function(){
    var s=Math.min(OW/im.width,OH/im.height), w=im.width*s, h=im.height*s;
    octx.clearRect(0,0,OW,OH);
    octx.drawImage(im,(OW-w)/2,OH-h,w,h);
    var d=octx.getImageData(0,0,OW,OH).data;
    lum=new Float32Array(OW*OH);
    for(var i=0;i<OW*OH;i++){
      var a=d[i*4+3]/255;
      var l=(0.299*d[i*4]+0.587*d[i*4+1]+0.114*d[i*4+2])/255;
      lum[i]=a<0.18?1:(1-a)+a*l;
    }
    draw();
  };
  im.src='/404/404-28-op/back.webp';

  var t=0, mx=0.5, my=0.48, raf=0, auto=touch, t0=Date.now();

  function size(){
    DPR=Math.min(window.devicePixelRatio||1,1.5);
    W=Math.max(1,cv.clientWidth); H=Math.max(1,cv.clientHeight);
    cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
    draw();
  }
  function sample(x,y){
    if(!lum) return 1;
    var u=(x-0.314*W)/(0.594*W), v=(y-0.120*H)/(0.772*H);
    if(u<0||u>=1||v<0||v>=1) return 1;
    return lum[((v*OH)|0)*OW+((u*OW)|0)];
  }
  function wy(x,y0,ph,cx,cy,k){
    var dx=(x-cx)/(240*k), dy=(y0-cy)/(240*k);
    var lens=Math.exp(-(dx*dx+dy*dy)*0.5);
    var amp=(3.2+13*lens)*k;
    return y0 + Math.sin(x*0.0125/k + t + ph)*amp + Math.sin(x*0.0037/k - t*0.5)*2.4*k;
  }
  function draw(){
    if(!W||!H) return;
    var k=Math.max(0.45,Math.min(2,Math.min(W/1280,H/800)));
    var cx=mx*W, cy=my*H;
    var N=84, gap=H/(N-1), step=Math.max(7,Math.round(W/170));
    ctx.fillStyle='#F2F1EC'; ctx.fillRect(0,0,W,H);
    for(var i=0;i<N;i++){
      var y0=i*gap, ph=i*0.28;
      ctx.fillStyle=(i>=33&&i<=38)?'#D93A1F':'#0D0D0D';
      ctx.beginPath();
      var first=true,x,yc,th;
      for(x=-step;x<=W+step;x+=step){
        yc=wy(x,y0,ph,cx,cy,k); th=(0.5+Math.pow(1-sample(x,yc),2)*7.9)*k;
        if(first){ctx.moveTo(x,yc-th/2);first=false;}else ctx.lineTo(x,yc-th/2);
      }
      for(x=W+step;x>=-step;x-=step){
        yc=wy(x,y0,ph,cx,cy,k); th=(0.5+Math.pow(1-sample(x,yc),2)*7.9)*k;
        ctx.lineTo(x,yc+th/2);
      }
      ctx.closePath(); ctx.fill();
    }
  }
  function loop(){
    t+=0.016;
    if(auto){
      var s=(Date.now()-t0)/1000;
      mx=0.5+Math.sin(s*0.34)*0.26; my=0.46+Math.cos(s*0.27)*0.20;
    }
    draw(); raf=requestAnimationFrame(loop);
  }
  function move(e){
    var r=cv.getBoundingClientRect();
    mx=(e.clientX-r.left)/r.width; my=(e.clientY-r.top)/r.height;
    auto=false;
  }
  window.addEventListener('pointermove',move,{passive:true});
  window.addEventListener('resize',size);
  size();
  if(!reduce) loop();
  /* 指の環境で数秒触られなければ、一度だけ自分から見せる */
  if(touch&&!reduce) setTimeout(function(){ if(!auto&&Date.now()-t0<9000) return; },1);
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(size).catch(function(){});
})();
</script>
</body>
</html>
