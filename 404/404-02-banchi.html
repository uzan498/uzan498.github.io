<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>404 ページが見つかりません ｜ 四〇四番地</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
/* width/height 属性は CSS の width/height に効いてしまう（presentational hint）。
   幅だけ指定した画像が属性の高さで固まるので、ここで無効化しておく */
img{max-width:none;width:auto;height:auto}
a{color:inherit}
:focus-visible{outline-offset:3px}

:root{ --pad:clamp(18px,4.2vw,68px); --ink:#FBF3EA; }
html{background:#2A1E22}
body{position:relative;min-height:100svh;overflow:hidden;
  display:flex;flex-direction:column;padding:var(--pad);
  background:#2A1E22;color:var(--ink);
  font-family:"Shippori Mincho B1","Hiragino Mincho ProN","Noto Serif JP",serif;
  -webkit-font-smoothing:antialiased}
.bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 42%;z-index:0}
/* 覆いは本文カラム（左）の幅に連動。狭い画面では上下だけにする */
.warm{position:fixed;inset:0;z-index:1;pointer-events:none;background:
  linear-gradient(100deg,rgba(38,24,28,.84) 0,rgba(38,24,28,.5) calc(var(--pad) + 26vw),
    rgba(38,24,28,.06) calc(var(--pad) + 46vw),rgba(38,24,28,0) calc(var(--pad) + 58vw)),
  linear-gradient(260deg,rgba(38,24,28,.6) 0,rgba(38,24,28,.16) 20%,rgba(38,24,28,0) 40%),
  linear-gradient(0deg,rgba(30,18,22,.78),transparent 44%)}
.petals{position:fixed;inset:0;z-index:2;overflow:hidden;pointer-events:none}
.petals i{position:absolute;width:9px;height:9px;background:#F6D2DA;border-radius:9px 1px 9px 1px;opacity:.85}

.kicker{position:relative;z-index:5;margin:0;font-family:"Zen Kaku Gothic New","Hiragino Sans",sans-serif;
  font-size:clamp(10px,.92vw,14px);letter-spacing:.26em;color:#E9CDB6}
.kicker b{color:#FFD9A0}

main{position:relative;z-index:5;flex:1;display:flex;align-items:flex-end;
  padding-block:clamp(14px,3vh,40px)}
.nav{display:flex;flex-direction:column;gap:clamp(6px,1.1vh,12px);
  width:min(24rem,52vw);max-width:100%}
.nav a{display:flex;align-items:center;justify-content:space-between;gap:14px;text-decoration:none;
  color:var(--ink);border-bottom:1px solid rgba(251,243,234,.32);
  padding:clamp(7px,1.1vh,11px) 2px;font-size:clamp(15px,min(1.5vw,2.4vh),24px);letter-spacing:.1em;
  text-shadow:0 2px 16px rgba(20,10,14,.9);transition:color .2s ease,border-color .2s ease}
.nav a span{font-family:"Zen Kaku Gothic New",sans-serif;font-size:clamp(9px,.85vw,12px);
  letter-spacing:.16em;color:rgba(251,243,234,.6);flex:0 0 auto}
.nav a.on{color:#FFC98A;border-bottom-color:rgba(255,201,138,.6)}
.nav a:hover{color:#FFC98A;border-bottom-color:rgba(255,201,138,.8)}
.note{position:relative;z-index:5;margin:clamp(12px,2vh,22px) 2px 0;
  font-family:"Zen Kaku Gothic New",sans-serif;font-size:clamp(10px,.92vw,14px);
  letter-spacing:.08em;color:rgba(251,243,234,.66);text-shadow:0 2px 12px rgba(20,10,14,.9)}

/* 縦組みは1字ずつ span を積む（webfontの縦書きメトリクスが崩れるため） */
.vt{position:fixed;z-index:5;font-family:"Shippori Mincho B1","Noto Serif JP",serif;
  text-shadow:0 3px 26px rgba(30,16,20,.95),0 1px 5px rgba(30,16,20,.8)}
.vt span{display:block;text-align:center}
.vt span.p{transform:translate(.34em,-.5em)}
.vt.big{right:calc(var(--pad) + .4vw);top:clamp(46px,7.5vh,68px);font-weight:700;color:#FFF6EC}
.vt.big span{width:calc(var(--vb) * 1.02);height:calc(var(--vb) * 1.32);
  line-height:calc(var(--vb) * 1.32);font-size:var(--vb)}
.vt.sm{right:calc(var(--pad) + var(--vb) * 2.1);top:clamp(70px,12vh,110px);font-weight:400;color:#F6E2D2}
.vt.sm span{width:calc(var(--vs) * 1.06);height:calc(var(--vs) * 1.4);
  line-height:calc(var(--vs) * 1.4);font-size:var(--vs)}
:root{ --vb:clamp(21px,min(3.6vw,5.1vh),50px); --vs:clamp(12px,min(1.95vw,2.7vh),26px); }

/* 表札 */
.plate{position:fixed;z-index:5;left:var(--pad);top:clamp(120px,31vh,270px);
  padding:clamp(9px,1.3vw,17px) clamp(6px,.9vw,13px);background:#2C1E15;border:2px solid #C9A87A;
  font-weight:700;color:#F3E3CB;box-shadow:0 16px 30px -16px rgba(0,0,0,.8);
  transform-origin:top center;animation:sway 6s ease-in-out infinite}
.plate span{display:block;text-align:center;
  width:calc(var(--vp) * 1.36);height:calc(var(--vp) * 1.43);line-height:calc(var(--vp) * 1.43);
  font-size:var(--vp)}
:root{ --vp:clamp(15px,min(2.2vw,3vh),29px); }
@keyframes sway{0%,100%{transform:rotate(-1.1deg)}50%{transform:rotate(1.1deg)}}

@media (max-width:900px){
  .warm{background:
    linear-gradient(180deg,rgba(30,18,22,.8) 0,rgba(30,18,22,.34) 18%,rgba(30,18,22,.1) 34%,
      rgba(30,18,22,.1) 52%,rgba(30,18,22,.66) 76%,rgba(30,18,22,.92) 100%)}
  .nav{width:min(24rem,72vw)}
  .plate{top:clamp(104px,26vh,200px)}
}
@media (max-width:560px){
  .plate{top:clamp(160px,34vh,320px)}   /* 顔より下、左端の背景の上 */
}
@media (prefers-reduced-motion:reduce){
  .plate{animation:none}
  .petals{display:none}
}
</style>
</head>
<body>
<img class="bg" src="/404/404-02-banchi/bg.webp" alt="" fetchpriority="high">
<div class="warm"></div>
<div class="petals" aria-hidden="true"></div>

<p class="kicker">迷い込んだ場所　<b>四〇四番地</b></p>

<h1 class="vt big" data-vt="この道の先に、"></h1>
<div class="vt sm" data-vt="お探しの頁は、ございません。"></div>
<div class="plate" data-vt="四〇四番地"></div>

<main>
  <nav class="nav">
    <a href="/?from=404-02-banchi" class="on">表通りへもどる<span>TOP</span></a>
    <a href="/?from=404-02-banchi" onclick="if(history.length>1){history.back();return false}">来た道をひきかえす<span>BACK</span></a>
    <a href="/performances.html?from=404-02-banchi">演奏会に誘う<span>EVENT !</span></a>
  </nav>
</main>
<p class="note">※ 迷ったのなら、少し歩いてみるのも悪くありません。</p>
<script>
(function(){

/* 縦組み：1字ずつ span にする */
var vts=document.querySelectorAll('[data-vt]');
for(var i=0;i<vts.length;i++){
  var el=vts[i], t=el.getAttribute('data-vt'); el.textContent='';
  for(var j=0;j<t.length;j++){
    var sp=document.createElement('span'); sp.textContent=t[j];
    if('、。，．'.indexOf(t[j])>=0) sp.className='p';
    el.appendChild(sp);
  }
}
/* 花びら */
var reduce=window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches;
if(!reduce){
  var box=document.querySelector('.petals'), n=18, made=[];
  for(var k=0;k<n;k++){
    var p=document.createElement('i');
    p.style.left=(Math.random()*100)+'%';
    p.style.top=(-10-Math.random()*40)+'%';
    var s=.6+Math.random()*.9;
    p.style.transform='scale('+s.toFixed(2)+')';
    p.animate([
      {transform:'translate(0,0) rotate(0deg) scale('+s.toFixed(2)+')',opacity:0},
      {opacity:.85,offset:.1},
      {transform:'translate('+(Math.random()*160-40)+'px,'+(innerHeight+160)+'px) rotate('+(360+Math.random()*540)+'deg) scale('+s.toFixed(2)+')',opacity:0}
    ],{duration:9000+Math.random()*9000,delay:Math.random()*9000,iterations:Infinity,easing:'linear'});
    box.appendChild(p);
  }
}
})();
</script>
</body>
</html>
