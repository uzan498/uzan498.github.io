<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>404 ページが見つかりません ｜ 四人とも、読めない</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
/* width/height 属性は CSS の width/height に効いてしまう（presentational hint）。
   幅だけ指定した画像が属性の高さで固まるので、ここで無効化しておく */
img{max-width:none;width:auto;height:auto}
a{color:inherit}
:focus-visible{outline-offset:3px}

:root{ --pad:clamp(18px,4.6vw,64px); }
html{background:#FAF6EF}
body{position:relative;min-height:100svh;overflow:hidden;background:#FAF6EF;color:#191713;
  display:flex;gap:clamp(18px,3vw,44px);align-items:center;padding:var(--pad);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}
.dots{position:fixed;inset:0;z-index:0;background-image:radial-gradient(#DFD6C6 1.2px,transparent 1.5px);
  background-size:10px 10px;opacity:.75}

.side{position:relative;z-index:5;flex:1 1 340px;min-width:0;max-width:470px}
.eyebrow{margin:0 0 clamp(11px,2vh,20px);font-size:clamp(10px,.94vw,12px);letter-spacing:.28em;color:#8C8271}
.eyebrow b{color:#D9503C;font-weight:700;font-size:clamp(11px,1.1vw,14px);letter-spacing:.1em}
h1{margin:0;font-size:clamp(21px,min(3.13vw,5vh),40px);font-weight:900;line-height:1.36;letter-spacing:.004em}
h1 em{font-style:normal;background:linear-gradient(transparent 60%,#FFD8A2 60%)}
.lead{margin:clamp(13px,2.6vh,24px) 0 0;font-size:clamp(12px,min(1.25vw,2vh),16px);
  line-height:1.95;color:#5B5346}
.btns{display:flex;flex-direction:column;gap:clamp(8px,1.4vh,12px);margin-top:clamp(18px,3.6vh,34px);
  align-items:flex-start}
.btn{text-decoration:none;border:2.5px solid #191713;border-radius:999px;color:#191713;
  padding:clamp(8px,1.4vh,11px) clamp(17px,2vw,26px);font-size:clamp(12px,min(1.21vw,1.94vh),15.5px);
  font-weight:700;box-shadow:4px 4px 0 #191713;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 #191713}
.btn.pri{background:#191713;color:#FAF6EF;box-shadow:4px 4px 0 #D9503C}
.btn.pri:hover{box-shadow:2px 2px 0 #D9503C}
.foot{position:absolute;left:var(--pad);bottom:clamp(14px,5vh,40px);margin:0;z-index:5;
  font-size:clamp(10px,.98vw,12.5px);color:#8C8271;letter-spacing:.06em}

.grid{position:relative;z-index:5;flex:0 0 auto;
  width:clamp(240px,min(55vw,96vh),700px);aspect-ratio:700/446;
  display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:clamp(7px,1.1vw,14px)}
.pn{position:relative;margin:0;background:#fff;border:3px solid #191713;overflow:hidden;
  min-width:0;opacity:0;
  animation:in .5s cubic-bezier(.2,1.6,.4,1) forwards, bob 4.8s ease-in-out infinite}
.pn:nth-child(1){animation-delay:.10s,.9s}
.pn:nth-child(2){animation-delay:.32s,1.3s}
.pn:nth-child(3){animation-delay:.54s,1.7s}
.pn:nth-child(4){animation-delay:.76s,2.1s}
@keyframes in{from{opacity:0;transform:scale(.9) rotate(-2.2deg)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.pn img{width:100%;height:100%;object-fit:cover;display:block}
.pn b{position:absolute;left:0;bottom:0;background:#191713;color:#FAF6EF;font-weight:500;
  font-size:clamp(9px,.98vw,12.5px);padding:5px clamp(8px,1vw,13px);letter-spacing:.08em}

@media (max-width:900px){
  body{flex-direction:column;align-items:stretch;justify-content:flex-start;
    gap:clamp(14px,2.4vh,22px);overflow-y:auto;padding-bottom:clamp(48px,10vh,80px)}
  .side{max-width:none;flex:0 0 auto}
  .grid{width:100%;align-self:center;max-width:520px}
  .foot{position:static;margin-top:12px}
}
@media (prefers-reduced-motion:reduce){ .pn{animation:none;opacity:1} }
</style>
</head>
<body>
<div class="dots"></div>

<div class="side">
  <p class="eyebrow">ERROR <b>404</b> ／ 全員に聞いてみました</p>
  <h1>うちの誰も、<br><em>見たことがありません</em>でした。</h1>
  <p class="lead">そのページについて、心当たりのある者がおりません。<br>お手数ですが、下からもう一度おねがいします。</p>
  <div class="btns">
    <a class="btn pri" href="/?from=404-04-yonin">じゃあ最初から（トップへ）</a>
    <a class="btn" href="/404.html">もう一度たずねる（？？）</a>
  </div>
</div>

<div class="grid">
  <figure class="pn"><img src="/404/404-04-yonin/f1.webp" alt=""><b>一人目・知らない</b></figure>
  <figure class="pn"><img src="/404/404-04-yonin/f2.webp" alt=""><b>二人目・読めない</b></figure>
  <figure class="pn"><img src="/404/404-04-yonin/f3.webp" alt=""><b>三人目・むずかしい</b></figure>
  <figure class="pn"><img src="/404/404-04-yonin/f4.webp" alt=""><b>四人目・お手上げ</b></figure>
</div>

<p class="foot">※ four out of four ／ 全会一致で不明です。</p>
</body>
</html>
