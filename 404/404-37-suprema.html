<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>404 ｜ 何も探すな。</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=IBM+Plex+Mono:wght@400;600&family=Shippori+Mincho+B1:wght@400;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overflow-x:clip}
html,body{margin:0;padding:0}
img{width:auto;height:auto;max-width:100%;display:block}
a{color:inherit}

:root{
  --pad:clamp(18px,3.6vw,64px);
  --ink:#141414;
  --paper:#F4F2EC;
  --hot:#C7301B;
  --grey:#6E6C66;
}
body{
  height:100svh;min-height:470px;display:flex;flex-direction:column;
  padding:var(--pad);gap:clamp(8px,1.4svh,18px);
  overflow:hidden;background:var(--paper);color:var(--ink);
  font-family:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.head,.foot{position:relative;z-index:3;flex:0 0 auto;
  display:flex;flex-wrap:wrap;gap:10px 20px;justify-content:space-between}
.head{align-items:flex-start}
.foot{align-items:flex-end}
.num{font-size:clamp(38px,min(5.4vw,8.6svh),64px);font-weight:800;letter-spacing:-.04em;line-height:1}
.eye{font-size:clamp(9px,.92vw,11px);letter-spacing:.42em;text-transform:uppercase;color:var(--grey);
  margin-top:6px}
.cnt{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:clamp(9px,.92vw,11px);
  letter-spacing:.18em;color:var(--grey);text-align:right;line-height:2;white-space:nowrap}

/* 形は 1280×800 の盤の上にある。盤ごと画面に収める */
.board{position:relative;z-index:1;flex:1 1 auto;min-height:170px;overflow:hidden;touch-action:none}
.plate{position:absolute;left:0;top:0;width:1280px;height:800px;transform-origin:0 0}
.sh{position:absolute;cursor:grab;overflow:hidden;transition:box-shadow .25s ease}
.sh:active{cursor:grabbing}
.sh.open{box-shadow:0 22px 44px -26px rgba(20,20,20,.7)}
.sh .win{position:absolute;inset:0;background-repeat:no-repeat;
  background-size:1280px 800px;opacity:0;transition:opacity .5s ease}
.sh.open .win{opacity:1}
.cir{border-radius:50%}
/* ---- 到着時の動き（原案の共通指定） ---- */
@keyframes enBlur{from{opacity:0;filter:blur(14px)}to{opacity:1;filter:blur(0)}}
.sh{animation:enBlur .8s ease backwards}

.say{font-family:"Shippori Mincho B1",serif;font-size:clamp(14px,min(1.7vw,2.5svh),20px);
  letter-spacing:.12em;color:#242422}
.en{font-size:clamp(9px,.92vw,11px);letter-spacing:.34em;color:var(--grey);
  text-transform:uppercase;margin-top:5px}
.link{display:inline-block;margin-top:9px;font-size:clamp(10px,1.05vw,12px);letter-spacing:.24em;
  text-transform:uppercase;text-decoration:none;border-bottom:2px solid var(--hot);padding-bottom:3px}
.link:hover{background:var(--hot);color:var(--paper);border-bottom-color:var(--ink)}
.hint{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:clamp(10px,1vw,11.5px);
  letter-spacing:.14em;color:var(--paper);background:var(--ink);padding:7px 13px;
  white-space:nowrap;flex:0 0 auto}

@media (max-width:640px){ .cnt{display:none} }
@media (prefers-reduced-motion:reduce){ .sh,.sh .win{transition:none} }
</style>
</head>
<body>

<header class="head">
  <div>
    <div class="num">404</div>
    <div class="eye">The page you're looking for doesn't exist</div>
  </div>
  <div class="cnt">FORM 7 ／ GROUND: WHITE<br>NON-OBJECTIVE ／ OPENED <span id="op">0</span></div>
</header>

<div class="board" id="board">
  <div class="plate" id="plate"></div>
</div>

<footer class="foot">
  <div>
    <div class="say">何も探さない。ここには何も。</div>
    <div class="en">the white is not empty</div>
    <a class="link" href="/?from=404-37-suprema">← back to zero</a>
  </div>
  <div class="hint" id="hint">掴むのですか？</div>
</footer>

<script>
(function(){
  var board=document.getElementById('board'), plate=document.getElementById('plate');
  var opEl=document.getElementById('op');
  var touch=!matchMedia('(hover:hover)').matches;
  if(touch){ var hn=document.getElementById('hint'); if(hn) hn.textContent='四角を指で動かす'; }

  var SHAPES=[
    {w:300,h:300,x:188,y:262,col:'#141414',win:1},
    {w:152,h:152,x:566,y:138,col:'#C7301B',win:1},
    {w:104,h:238,x:784,y:306,col:'#1E4FD8',win:1},
    {w:124,h:124,x:912,y:574,col:'#141414',win:1,cir:1},
    {w:404,h:42, x:322,y:176,col:'#141414',rot:-27},
    {w:296,h:16, x:596,y:556,col:'#141414',rot:13},
    {w:62, h:62, x:1078,y:214,col:'#141414'}
  ];
  var IMGURL='/404/404-37-suprema/sc_garden.webp';
  var opened=0, els=[];

  SHAPES.forEach(function(s,si){
    var d=document.createElement('div');
    d.className='sh'+(s.cir?' cir':'');
    d.style.cssText='width:'+s.w+'px;height:'+s.h+'px;left:'+s.x+'px;top:'+s.y+'px;background:'+s.col;
    d.style.animationDelay=(si*0.08)+'s';
    if(s.rot) d.style.transform='rotate('+s.rot+'deg)';
    if(s.win){
      var w=document.createElement('div'); w.className='win';
      w.style.backgroundImage='url("'+IMGURL+'")';
      d.appendChild(w);
    }
    plate.appendChild(d); els.push(d); place(d);
  });
  function place(sh){
    var w=sh.querySelector('.win'); if(!w) return;
    w.style.backgroundPosition=(-parseFloat(sh.style.left))+'px '+(-parseFloat(sh.style.top))+'px';
  }

  var scale=1, ox=0, oy=0;
  function fit(){
    var w=board.clientWidth, h=board.clientHeight;
    scale=Math.min(w/1280,h/800);
    ox=(w-1280*scale)/2; oy=(h-800*scale)/2;
    plate.style.transform='translate('+ox.toFixed(1)+'px,'+oy.toFixed(1)+'px) scale('+scale.toFixed(4)+')';
  }
  window.addEventListener('resize',fit);
  fit();

  var drag=null;
  function down(e){
    var sh=e.target.closest('.sh'); if(!sh) return;
    if(sh.querySelector('.win') && !sh.classList.contains('open')){
      sh.classList.add('open'); opened++; if(opEl) opEl.textContent=opened;
    }
    drag={sh:sh,ox:e.clientX,oy:e.clientY,
          l:parseFloat(sh.style.left),t:parseFloat(sh.style.top)};
    sh.style.zIndex=String(20+opened);
    if(board.setPointerCapture) try{ board.setPointerCapture(e.pointerId); }catch(_){}
    e.preventDefault();
  }
  function move(e){
    if(!drag) return;
    var k=1/Math.max(0.0001,scale);
    var nl=drag.l+(e.clientX-drag.ox)*k, nt=drag.t+(e.clientY-drag.oy)*k;
    /* 盤の外へは出ていかない */
    nl=Math.max(-drag.sh.offsetWidth*0.5, Math.min(1280-drag.sh.offsetWidth*0.5, nl));
    nt=Math.max(-drag.sh.offsetHeight*0.5,Math.min(800-drag.sh.offsetHeight*0.5, nt));
    drag.sh.style.left=nl.toFixed(1)+'px'; drag.sh.style.top=nt.toFixed(1)+'px';
    place(drag.sh);
  }
  function up(){ drag=null; }
  board.addEventListener('pointerdown',down);
  board.addEventListener('pointermove',move);
  window.addEventListener('pointerup',up);
  window.addEventListener('pointercancel',up);

  /* 指の環境で数秒触られなければ、一つだけ開いて見せる */
  if(touch){
    setTimeout(function(){
      if(opened) return;
      var d=els[0];
      if(d && d.querySelector('.win')){ d.classList.add('open'); opened=1; if(opEl) opEl.textContent='1'; }
    },3400);
  }
})();
</script>
</body>
</html>
