<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>404 ページが見つかりません ｜ のぞき穴？
</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700&family=Zen+Kaku+Gothic+New:wght@400;900&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
/* width/height 属性は CSS の width/height に効いてしまう（presentational hint）。
   幅だけ指定した画像が属性の高さで固まるので、ここで無効化しておく */
img{max-width:none;width:auto;height:auto}
a{color:inherit}
:focus-visible{outline-offset:3px}

:root{ --pad:clamp(20px,6.25vw,80px); --paper:#F1EDE3; --ink:#16140F; }
html{background:#0E0C08;height:100svh;overflow:hidden}
body{position:relative;height:100svh;overflow:hidden;background:#0E0C08;color:var(--ink);
  display:flex;flex-direction:column;padding:var(--pad);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}
@keyframes fi{to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.scene{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 50%;
  z-index:0;opacity:0;animation:fi 1.1s ease .1s forwards}
/* 紙を 404 の形にくり抜く。slice なので枠外にも紙が伸びるよう矩形は大きめに取る */
.cut{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;
  opacity:0;animation:fi .7s ease .05s forwards}
.grain{position:fixed;inset:0;z-index:2;pointer-events:none;
  background-image:repeating-linear-gradient(0deg,rgba(120,104,72,.035) 0 1px,transparent 1px 4px)}

.head{position:relative;z-index:3;flex:0 0 auto}
.rule{display:block;height:1px;background:var(--ink);opacity:.7}
.lbls{display:flex;justify-content:space-between;gap:12px;margin-top:14px;
  font-size:clamp(9px,.82vw,10.5px);letter-spacing:.34em;color:#7C7565}
.hint{margin:clamp(10px,2vh,18px) 0 0;font-size:clamp(9.5px,.86vw,11px);letter-spacing:.22em;
  color:rgba(28,24,16,.62);opacity:0;transition:opacity .5s ease;animation:fi .9s ease 2s forwards}
.hint:before{content:"";display:inline-block;width:22px;height:1px;background:currentColor;
  vertical-align:middle;margin-right:12px}

.spacer{flex:1;min-height:0}

.foot{position:relative;z-index:3;flex:0 0 auto;
  margin:0 calc(var(--pad) * -1) calc(var(--pad) * -1);
  padding:clamp(48px,14vh,120px) var(--pad) var(--pad);
  background:linear-gradient(0deg,var(--paper) 62%,rgba(241,237,227,0) 100%)}
.say{margin:0;font-family:"Shippori Mincho B1","Hiragino Mincho ProN",serif;
  font-size:clamp(17px,min(2.27vw,3.63vh),29px);font-weight:700;line-height:1.9;letter-spacing:.08em;
  opacity:0;animation:up .9s ease 1.1s forwards}
.sub{margin:clamp(8px,1.5vh,14px) 2px 0;font-size:clamp(10px,1.02vw,13px);letter-spacing:.08em;
  color:#6E6857;opacity:0;animation:up .9s ease 1.25s forwards}
.links{display:flex;align-items:stretch;flex-wrap:wrap;gap:clamp(4px,.8vw,10px) 0;
  margin-top:clamp(14px,2.8vh,28px);opacity:0;animation:up .9s ease 1.4s forwards}
.links a{text-decoration:none;color:var(--ink);font-size:clamp(11px,min(1.1vw,1.75vh),14px);
  letter-spacing:.1em;padding:2px clamp(12px,1.7vw,22px);
  border-left:1px solid rgba(22,20,15,.3);display:flex;flex-direction:column;gap:3px}
.links a:first-child{padding-left:0;border-left:0}
.links a s{text-decoration:none;font-size:clamp(8px,.74vw,9.5px);letter-spacing:.26em;color:#8C8474}
.links a.on{color:#8A3B22}
.links a:hover{color:#8A3B22}

@media (max-width:640px){
  .links{flex-direction:column;align-items:flex-start;gap:12px}
  .links a{border-left:0;padding-left:0}
  .lbls .r{display:none}
}
@media (prefers-reduced-motion:reduce){
  .scene,.cut,.hint,.say,.sub,.links{animation-duration:.01ms;animation-delay:0s;opacity:1;transform:none}
}
</style>
</head>
<body>
<img class="scene" src="/404/404-24-mado/scene.webp" alt="" fetchpriority="high">

<svg class="cut" viewBox="0 0 1280 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <mask id="peek" maskUnits="userSpaceOnUse" x="-1280" y="-800" width="3840" height="2400">
      <rect x="-1280" y="-800" width="3840" height="2400" fill="#fff"/>
      <text class="hole" x="468" y="336" fill="#000" text-anchor="middle"
        style="font-family:'Zen Kaku Gothic New',sans-serif;font-weight:900;font-size:302px;letter-spacing:-.035em"
        dominant-baseline="central">404</text>
    </mask>
  </defs>
  <rect x="-1280" y="-800" width="3840" height="2400" fill="#F1EDE3" mask="url(#peek)"/>
  <text class="edge" x="468" y="336" fill="none" stroke="rgba(22,20,15,.42)" stroke-width="1.4"
    text-anchor="middle"
    style="font-family:'Zen Kaku Gothic New',sans-serif;font-weight:900;font-size:302px;letter-spacing:-.035em"
    dominant-baseline="central">404</text>
</svg>
<div class="grain"></div>

<div class="head">
  <span class="rule"></span>
  <div class="lbls"><span class="l">ERROR 404</span><span class="r">LOOK THROUGH</span></div>
  <p class="hint">カーソルを動かすと、404穴(?)も動きます</p>
</div>

<div class="spacer"></div>

<div class="foot">
  <h1 class="say">申し訳ございません、<br>そのページは見つかりませんでした。</h1>
  <p class="sub">穴は動かせますが、これ以上ひろがりません。</p>
  <nav class="links">
    <a href="/?from=404-24-mado" class="on">正面からたずねる<s>TOP</s></a>
    <a href="/performances.html">出演情報を見る<s>GALLERY</s></a>
    <a href="/index.html#contact">お問い合わせ<s>SEARCH</s></a>
  </nav>
</div>
<script>
(function(){

var svg=document.querySelector('.cut'),
    hole=svg.querySelector('.hole'), edge=svg.querySelector('.edge'),
    hint=document.querySelector('.hint');
var BASE=302, x=468, y=336, tx=468, ty=336, raf=null, touched=false;
var lim={x0:340,x1:950,y0:150,y1:470};
var coarse = window.matchMedia && window.matchMedia('(hover:none)').matches;
if(coarse) hint.textContent='指でなぞると、のぞく穴も動きます';

/* 書体が実際に読み込まれるまで幅は分からない。必ず実測してから大きさを決める */
function fit(){
  var cw=svg.clientWidth, ch=svg.clientHeight;
  if(!cw||!ch) return;
  var s=Math.max(cw/1280, ch/800);                 /* slice の拡大率 */
  hole.style.fontSize=BASE+'px'; edge.style.fontSize=BASE+'px';
  var bb;
  try{ bb=edge.getBBox(); }catch(e){ return; }
  if(!bb || !bb.width) return;
  var wantUser=(cw*0.74)/s, hUser=(ch*0.52)/s;
  var f=Math.min(BASE, BASE*wantUser/bb.width, BASE*hUser/bb.height);
  f=Math.max(64,f);
  hole.style.fontSize=f+'px'; edge.style.fontSize=f+'px';
  /* 穴が画面の外へ出ないよう、可動範囲も実寸から決める */
  var halfW=bb.width*(f/BASE)/2, halfH=bb.height*(f/BASE)/2;
  var vw=cw/s, vh=ch/s, cx=640, cy=400;
  lim.x0=cx-vw/2+halfW+12; lim.x1=cx+vw/2-halfW-12;
  lim.y0=cy-vh/2+halfH+12; lim.y1=cy+vh/2-halfH-12;
  if(lim.x1<lim.x0){ lim.x0=lim.x1=cx; }
  if(lim.y1<lim.y0){ lim.y0=lim.y1=cy; }
  tx=Math.max(lim.x0,Math.min(lim.x1,tx)); ty=Math.max(lim.y0,Math.min(lim.y1,ty));
}
function toUser(cx,cy){
  var m=svg.getScreenCTM(); if(!m) return null;
  var i=m.inverse();
  return { x:i.a*cx+i.c*cy+i.e, y:i.b*cx+i.d*cy+i.f };
}
function move(e){
  var p=toUser(e.clientX,e.clientY); if(!p) return;
  touched=true;
  tx=Math.max(lim.x0,Math.min(lim.x1,p.x));
  ty=Math.max(lim.y0,Math.min(lim.y1,p.y));
  hint.style.opacity=0;
}
function step(){
  x+=(tx-x)*0.09; y+=(ty-y)*0.09;
  var px=x.toFixed(1), py=y.toFixed(1);
  hole.setAttribute('x',px); hole.setAttribute('y',py);
  edge.setAttribute('x',px); edge.setAttribute('y',py);
  raf=requestAnimationFrame(step);
}
/* マウスにもタッチにも効くように pointer 系で受ける */
addEventListener('pointermove',move);
addEventListener('pointerdown',move);

fit(); tx=x=(lim.x0+lim.x1)/2; ty=y=(lim.y0+lim.y1)/2;
raf=requestAnimationFrame(step);

/* 書体が後から届いたら測り直す */
if(document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
setTimeout(fit,900);
var rz=null;
addEventListener('resize',function(){ clearTimeout(rz); rz=setTimeout(fit,150); });

/* 触られないまま置かれたときに、一度だけ動かして見せる */
setTimeout(function(){
  if(touched) return;
  var i=0, id=setInterval(function(){
    if(touched){ clearInterval(id); return; }
    var t=i/40;
    tx=lim.x0+(lim.x1-lim.x0)*(.2+.6*t);
    ty=lim.y0+(lim.y1-lim.y0)*(.5+.28*Math.sin(t*6));
    if(++i>40) clearInterval(id);
  },34);
},2800);
})();
</script>
</body>
</html>
